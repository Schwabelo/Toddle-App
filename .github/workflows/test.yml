name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (includes the study-hub.html freshness check)
        run: node --test tests/*.test.mjs
      - name: Single-file build is up to date
        run: node build-single.mjs --check
