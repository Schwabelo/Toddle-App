}

// ---- planner.js ----
// Weekly planner: put assignments on days, watch the load per day, and auto-spread what's left.









let anchor = null; // any date inside the week being shown

// Used by alerts to open the planner on the week of a given day.
function showWeekOf(date) {
  anchor = date;
}

const weekStartOf = (d) => addDays(d, -((parseYmd(d).getDay() - Number(state.settings.weekStart) + 7) % 7));
function weekOf() {
  anchor ||= today();
  const start = weekStartOf(anchor);
  return { start, end: addDays(start, 6), days: Array.from({ length: 7 }, (_, i) => addDays(start, i)) };
}

const estOf = (uid) => state.est[uid] || (uid.startsWith('prep:') ? Number(state.settings.prepMin) || 45 : Number(state.settings.defaultEst) || 30);

// Open summatives, grouped into weeks that have two or more.
const openSummatives = () => todos().filter((e) => isSummative(e) && !isDone(e.uid));
const busyWeeks = () => crunchWeeks(openSummatives(), weekStartOf, 2);

// Everything the planner can place: real to-dos plus revision sessions before summatives.
function plannable() {
  const items = todos();
  if (!state.settings.prepSessions) return items;
  const crunchStarts = new Set(busyWeeks().map((w) => w.start));
  const off = closures();
  const avoid = state.settings.planWeekends ? () => false : (d) => isWeekend(d) || Boolean(off[d]);
  return items.concat(prepTasks(openSummatives(), { today: today(), crunchStarts, weekStartOf, avoid, title: (e) => displayTitle(e.title) }));
}

function setPlan(uid, date) {
  if (date) state.plan[uid] = date;
  else delete state.plan[uid];
  save();
}

function loadByDay(days) {
  const load = {};
  for (const e of plannable()) {
    const d = state.plan[e.uid];
    if (d && days.includes(d) && !isDone(e.uid)) load[d] = (load[d] || 0) + estOf(e.uid);
  }
  return load;
}

// Open, unplanned work due by the end of this week (plus anything recently overdue).
function trayTasks(w) {
  const oldest = addDays(today(), -14);
  return plannable().filter((e) => !isDone(e.uid) && !state.plan[e.uid] && e.date <= w.end && e.date >= oldest && !isCatchup(e));
}

function todaysPlan() {
  const items = plannable().filter((e) => state.plan[e.uid] === today() && !isDone(e.uid));
  return { items, minutes: items.reduce((a, e) => a + estOf(e.uid), 0) };
}

// ---- views ----
function planCard(e, w) {
  const id = esc(e.uid);
  const done = isDone(e.uid);
  const planned = state.plan[e.uid] || '';
  const est = state.est[e.uid];
  const cls = e.classes[0] || '';
  const c = classInfo(cls);
  const prep = e.kind === 'prep';
  const late = !done && !prep && isOverdue(e);
  const after = planned && planned > e.date && !done && !late;
  const options = ['<option value="">Not planned</option>']
    .concat(w.days.map((d) => `<option value="${d}" ${d === planned ? 'selected' : ''}>${fmtDate(d)}</option>`))
    .join('');
  return `
  <div class="pcard ${done ? 'is-done' : ''} ${prep ? 'prep' : ''}" draggable="true" data-drag="${id}" style="--c:${c.color}">
    <details class="p-main" data-keep="p-${id}">
      <summary>
        <span class="p-title">${esc(displayTitle(e.title))}</span>
        <span class="p-meta">
          <button class="check" data-action="toggle" data-uid="${id}" aria-pressed="${done}" aria-label="${done ? 'Mark as not done' : 'Mark as done'}">${done ? '✓' : ''}</button>
          <span class="p-cls">${esc(c.name)}</span>
          <span class="p-min">${est ? est : '~' + estOf(e.uid)} min</span>
        </span>
        ${!planned && !late ? `<span class="p-due">${prep ? 'Before' : 'Due'} ${esc(fmtDate(e.date, { weekday: 'short', day: 'numeric' }))}</span>` : ''}${late ? '<span class="p-flag">overdue</span>' : ''}${after ? `<span class="p-flag">${prep ? 'late for revision' : 'after due date'}</span>` : ''}
      </summary>
      <div class="p-edit">
        <div class="muted small">${prep ? 'Revise by' : 'Due'} ${esc(fmtDate(e.date))}${e.allDay ? '' : ' · ' + esc(fmtTime(dueClock(e), state.settings.time24))}</div>
        <label class="field">Day <select data-change="plan-day" data-uid="${id}">${options}</select></label>
        <label class="field">Minutes <input type="number" min="5" max="480" step="5" data-change="plan-est" data-uid="${id}" value="${est || ''}" placeholder="${estOf(e.uid)}"></label>
        <div class="row"><button class="btn small" data-action="plan-focus" data-cls="${esc(cls)}">Start timer</button><button class="btn small" data-action="open-task" data-uid="${esc(prep ? e.of : e.uid)}">Details</button></div>
      </div>
    </details>
  </div>`;
}

const dueMark = (e) =>
  `<div class="due-mark"><b>Due</b> ${e.allDay ? '' : esc(fmtTime(dueClock(e), state.settings.time24)) + ' · '}${esc(displayTitle(e.title))}</div>`;

function lessonsLine(d) {
  const { lessons, free } = dayTimetable(d);
  if (!lessons.length) return '';
  const names = lessons.map((l) => `<span class="lesson-pill" style="--c:${l.cls ? classInfo(l.cls).color : 'var(--muted)'}" title="${esc(l.start)}–${esc(l.end)}">${esc(l.cls ? classInfo(l.cls).name : l.name)}</span>`).join('');
  return `<div class="p-lessons">${names}</div>${free.length ? `<div class="muted small">Free: ${free.map((p) => `P${p.num} ${esc(fmtTime(p.start, state.settings.time24))}`).join(', ')}</div>` : ''}`;
}

function plannerPage() {
  if (!state.events.length) {
    return '<h1>Planner</h1>' + emptyState('📥', 'Import your Toddle calendar first', 'The planner works with your assignments.', '<a class="btn primary" href="#/settings">Go to import</a>');
  }
  const w = weekOf();
  const t = today();
  const limit = Number(state.settings.dailyLimit) || 90;
  const load = loadByDay(w.days);
  const tray = trayTasks(w);

  const off = closures();
  const plannedBy = {};
  const dueBy = {};
  for (const e of plannable()) {
    const p = state.plan[e.uid];
    if (p && p >= w.start && p <= w.end) (plannedBy[p] ||= []).push(e);
    // Deadline reminders only for work that is planned on another day; unplanned work is already in the tray.
    if (e.kind !== 'prep' && p && p !== e.date && !isDone(e.uid) && e.date >= w.start && e.date <= w.end) (dueBy[e.date] ||= []).push(e);
  }
  const busy = busyWeeks().find((x) => x.start === w.start);

  const columns = w.days.map((d) => {
    const mins = load[d] || 0;
    const over = mins > limit;
    const planned = plannedBy[d] || [];
    const due = dueBy[d] || [];
    return `
    <div class="pday ${d === t ? 'today' : ''} ${isWeekend(d) || off[d] ? 'weekend' : ''}" data-drop="${d}">
      <div class="pday-head"><strong>${fmtDate(d, { weekday: 'short', day: 'numeric' })}</strong><span class="small ${over ? 'over' : 'muted'}">${mins} / ${limit} min</span></div>
      <div class="bar"><span style="width:${Math.min(100, (100 * mins) / limit)}%;background:${over ? 'var(--warn)' : 'var(--accent)'}"></span></div>
      ${off[d] ? `<div class="p-off">${esc(off[d])}</div>` : lessonsLine(d)}
      ${due.map(dueMark).join('')}
      ${planned.map((e) => planCard(e, w)).join('')}
      ${planned.length || due.length ? '' : '<p class="muted small">Nothing planned</p>'}
    </div>`;
  }).join('');

  const range = `${fmtDate(w.start, { day: 'numeric', month: 'short' })} – ${fmtDate(w.end, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return `
  <div class="page-head"><div><h1>Planner</h1><p class="muted">${range}</p></div>
    <div class="row"><button class="btn small" data-action="plan-prev" aria-label="Previous week">‹</button><button class="btn small" data-action="plan-today">This week</button><button class="btn small" data-action="plan-next" aria-label="Next week">›</button></div></div>
  ${busy ? `<p class="note">Busy week: ${busy.items.length} summatives (${busy.items.map((e) => esc(displayTitle(e.title))).join(', ')}).${state.settings.prepSessions ? ' Their revision sessions are due 3 days early.' : ''}</p>` : ''}
  <section class="card" data-drop="">
    <div class="sec-head"><h2>To plan <span class="count">${tray.length}</span></h2>
      <div class="row"><button class="btn small" data-action="plan-clear">Clear week</button><button class="btn small primary" data-action="plan-auto">Auto-plan</button></div></div>
    ${tray.length ? `<div class="tray">${tray.map((e) => planCard(e, w)).join('')}</div>` : '<p class="muted">Everything due this week is planned.</p>'}
    <p class="muted small">Drag a card onto a day, or open it and pick a day. Auto-plan spreads the work before each deadline, up to ${limit} min a day${state.settings.planWeekends ? '' : ', skipping weekends and school holidays'}. ${state.settings.prepSessions ? 'Summatives get a revision session (✎). ' : ''}Limits are in Settings.</p>
  </section>
  <div class="pweek" style="--cols:${w.days.map((d) => (isWeekend(d) && !state.settings.planWeekends ? 'minmax(0,.8fr)' : 'minmax(0,1.3fr)')).join(' ')}">${columns}</div>`;
}

// ---- actions ----
actions['plan-prev'] = () => { anchor = addDays(weekOf().start, -7); rerender(); };
actions['plan-next'] = () => { anchor = addDays(weekOf().start, 7); rerender(); };
actions['plan-today'] = () => { anchor = today(); rerender(); };

actions['plan-auto'] = () => {
  const w = weekOf();
  const open = trayTasks(w);
  if (!open.length) return toast('Nothing left to plan this week.');
  const plan = autoPlan({
    tasks: open,
    load: loadByDay(w.days),
    today: today(),
    weekStart: w.start,
    weekEnd: w.end,
    weekends: Boolean(state.settings.planWeekends),
    blocked: new Set(Object.keys(closures())),
    estOf,
  });
  if (!plan) return toast('That week is already over. Pick this week or a later one.');
  Object.entries(plan).forEach(([uid, d]) => { state.plan[uid] = d; });
  save();
  const over = Object.values(loadByDay(w.days)).filter((m) => m > (Number(state.settings.dailyLimit) || 90)).length;
  toast(`Planned ${Object.keys(plan).length} items${over ? `. ${over} day${over > 1 ? 's are' : ' is'} over your daily limit` : ''}`);
  rerender();
};

actions['plan-clear'] = async () => {
  const w = weekOf();
  const mine = Object.entries(state.plan).filter(([uid, d]) => d >= w.start && d <= w.end && !isDone(uid));
  if (!mine.length) return toast('Nothing planned this week.');
  if (!(await ask(`Remove the plan for ${mine.length} item${mine.length > 1 ? 's' : ''} this week?`, { ok: 'Clear week' }))) return;
  mine.forEach(([uid]) => delete state.plan[uid]);
  save();
  rerender();
};

actions['plan-focus'] = (el) => {
  focusOn(el.dataset.cls);
  location.hash = '#/timer';
};

changes['plan-day'] = (el) => {
  setPlan(el.dataset.uid, el.value);
  rerender();
};
changes['plan-est'] = (el) => {
  const n = Math.round(Number(el.value));
  if (n >= 1) state.est[el.dataset.uid] = Math.min(480, n);
  else delete state.est[el.dataset.uid];
  save();
  rerender();
};

// ---- drag and drop (a select on each card covers touch screens) ----
let dragUid = null;
const zoneOf = (e) => (e.target instanceof Element ? e.target.closest('[data-drop]') : null);

document.addEventListener('dragstart', (e) => {
  const card = e.target instanceof Element ? e.target.closest('[data-drag]') : null;
  if (!card) return;
  dragUid = card.dataset.drag;
  e.dataTransfer.setData('text/plain', dragUid);
  e.dataTransfer.effectAllowed = 'move';
  card.classList.add('dragging');
});
document.addEventListener('dragend', () => {
  dragUid = null;
  document.querySelectorAll('.dragging, .drop-on').forEach((el) => el.classList.remove('dragging', 'drop-on'));
});
document.addEventListener('dragover', (e) => {
  const zone = zoneOf(e);
  if (!zone || !dragUid) return;
  e.preventDefault();
  zone.classList.add('drop-on');
});
document.addEventListener('dragleave', (e) => {
  const zone = zoneOf(e);
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop-on');
});
document.addEventListener('drop', (e) => {
  const zone = zoneOf(e);
  if (!zone || !dragUid) return;
  e.preventDefault();
  setPlan(dragUid, zone.dataset.drop);
  dragUid = null;
  rerender();
});

// ---- alerts.js ----
// Alerts: what is overdue or due soon, what is new from Toddle, and a direct way to deal with each.

// Warnings cover to-dos only, and not the older work waiting in the one-time catch-up.
const alertable = (e) => isTodo(e) && !isCatchup(e);







const num = (v, fallback) => (Number(v) > 0 ? Number(v) : fallback);

function currentAlerts(now = Date.now()) {
  const s = state.settings;
  const all = tasks();
  const found = classify(all, {
    now,
    warnHours: num(s.warnHours, 24),
    assessDays: num(s.warnAssessDays, 3),
    isDone,
    isMuted: (uid) => Boolean(state.mute[uid]),
    isTodo: alertable,
  });
  const byUid = new Map(all.map((e) => [e.uid, e]));
  const news = (state.changes || [])
    .map((c) => ({ ...c, e: byUid.get(c.uid) }))
    .filter((c) => c.e && alertable(c.e) && !isDone(c.uid) && !state.mute[c.uid] && now - c.at < 3 * DAY);
  return { ...found, news, count: found.overdue.length + found.soon.length };
}

// ---- rows ----
const classLink = (e) => `#/class/${encodeURIComponent(e.classes[0] || '')}/${encodeURIComponent(e.uid)}`;

function alertRow(item, kind) {
  const e = item.e;
  const id = esc(e.uid);
  const hot = kind === 'overdue' || item.urgent;
  const when = kind === 'overdue' ? `Overdue by ${humanSpan(item.late)}` : `Due in ${humanSpan(item.left)}`;
  const cls = e.classes[0] || '';
  const decks = state.decks.filter((d) => d.link === e.uid);
  return `
  <div class="arow ${hot ? 'hot' : ''}">
    <div class="arow-main">
      <button class="task-title task-open linkish" data-action="open-task" data-uid="${id}">${esc(displayTitle(e.title))}</button>
      <div class="task-meta"><span class="${hot ? 'late' : 'soonc'}">${when}</span><span>${esc(dueText(e))}</span>${tagsFor(e)}${e.classes.map(classLabel).join('')}</div>
    </div>
    <div class="arow-actions">
      <button class="btn small" data-action="toggle" data-uid="${id}">Done</button>
      ${state.plan[e.uid] === today() ? '<span class="muted small">Planned today ✓</span>' : `<button class="btn small" data-action="alert-today" data-uid="${id}">Plan today</button>`}
      <details class="more"><summary class="btn small" aria-label="More actions">⋯</summary>
        <div class="more-menu">
          <a href="${classLink(e)}">Open in class</a>
          <button data-action="alert-planner" data-date="${kind === 'overdue' ? today() : e.date}">Open in planner</button>
          ${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener noreferrer">Open in Toddle ↗</a>` : ''}
          ${decks.map((d) => `<a href="#/flashcards/${d.id}">Study cards: ${esc(d.name)}</a>`).join('')}
          <button data-action="alert-timer" data-cls="${esc(cls)}">Start timer</button>
          <button data-action="set-status" data-uid="${id}" data-s="material">Not homework</button>
          <button data-action="alert-mute" data-uid="${id}">Ignore this one</button>
        </div>
      </details>
    </div>
  </div>`;
}

function newsRow(c) {
  const e = c.e;
  const what = c.kind === 'new'
    ? 'New'
    : `Moved from ${fmtDate(c.from.date)}${c.from.time ? ' ' + fmtTime(c.from.time, state.settings.time24) : ''}`;
  return `
  <div class="arow">
    <div class="arow-main">
      <button class="task-title task-open linkish" data-action="open-task" data-uid="${esc(e.uid)}">${esc(displayTitle(e.title))}</button>
      <div class="task-meta"><span class="soonc">${what}</span><span>Due ${esc(dueText(e))}</span>${tagsFor(e)}${e.classes.map(classLabel).join('')}</div>
    </div>
    <div class="arow-actions"><button class="btn small" data-action="open-task" data-uid="${esc(e.uid)}">Open</button></div>
  </div>`;
}

const section = (title, count, body, extra = '') =>
  `<section class="card"><div class="sec-head"><h2>${title} <span class="count">${count}</span></h2>${extra}</div><div class="alist">${body}</div></section>`;

// ---- pages and cards ----
function alertsPage() {
  if (!state.events.length) {
    return '<h1>Needs attention</h1>' + emptyState('📥', 'Nothing imported yet', 'Import your Toddle calendar and this page will warn you about overdue and upcoming work.', '<a class="btn primary" href="#/settings">Go to import</a>');
  }
  const a = currentAlerts();
  const head = `<div class="page-head"><div><h1>Needs attention</h1><p class="muted">${syncLineHtml()}</p></div><a class="btn small" href="#/settings">Alert settings</a></div>`;
  if (!a.count && !a.news.length && !a.older) {
    return head + emptyState('✅', 'All clear', `Nothing is overdue and nothing is due in the next ${num(state.settings.warnHours, 24)} hours.`);
  }
  const overdueBody = a.overdue.map((x) => alertRow(x, 'overdue')).join('')
    + (a.older ? `<p class="muted small">${a.older} older overdue item${a.older > 1 ? 's are' : ' is'} not listed. <button class="linkbtn" data-action="mark-older-done">Mark them done</button></p>` : '');
  return `${head}
  ${a.overdue.length || a.older ? section('Overdue', a.overdue.length, overdueBody) : ''}
  ${a.soon.length ? section('Due soon', a.soon.length, a.soon.map((x) => alertRow(x, 'soon')).join('')) : ''}
  ${a.news.length ? section('New or changed in Toddle', a.news.length, a.news.map(newsRow).join(''), '<button class="btn small" data-action="changes-seen">Mark as seen</button>') : ''}`;
}

// Compact version for the Start page: the most pressing items first.
function needsAttentionCard() {
  const a = currentAlerts();
  if (!a.count && !a.news.length) return '';
  const rows = [
    ...a.soon.filter((x) => x.urgent).map((x) => [x, 'soon']),
    ...a.overdue.map((x) => [x, 'overdue']),
    ...a.soon.filter((x) => !x.urgent).map((x) => [x, 'soon']),
  ];
  return `<section class="card attn"><div class="sec-head"><h2>Needs attention <span class="count">${a.count || ''}</span></h2><a class="btn small" href="#/alerts">See all</a></div>
    ${rows.length ? `<div class="alist">${rows.slice(0, 5).map(([x, k]) => alertRow(x, k)).join('')}</div>` : ''}
    ${rows.length > 5 ? `<p class="muted small">+ ${rows.length - 5} more. <a href="#/alerts">See all</a></p>` : ''}
    ${a.news.length ? `<p class="muted small"><a href="#/alerts">${a.news.length} new or changed in Toddle</a></p>` : ''}</section>`;
}

// ---- sync status ----
const ago = (ts) => {
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
};
const canSync = () => Boolean(state.feedUrl && getProxy());

function syncText() {
  if (syncStatus.busy) return 'Syncing…';
  if (syncStatus.error) return 'Sync failed. Retry';
  return state.lastSync ? `Synced ${ago(state.lastSync)}` : 'Not synced yet';
}

// "Synced 3 min ago · Sync now" for page headers.
function syncLineHtml() {
  if (!canSync()) return state.events.length ? 'Updates come from the file you uploaded.' : '';
  return `<span id="sync-line"><span class="${syncStatus.error ? 'late' : ''}">${esc(syncText())}</span> · <button class="linkbtn" data-action="sync-bg">Sync now</button></span>`;
}

actions['sync-bg'] = async () => {
  if (!canSync()) return toast('Add your Toddle link in Settings first.');
  const r = await backgroundSync('manual');
  updateChrome();
  if (r && r.error) toast('Sync failed. Details are in Settings.');
  else if (r && r.changed) {
    toast('Updated from Toddle');
    rerender();
  } else toast('Already up to date');
};

// ---- banner, nav badge, sync chip, notifications ----
let hiddenSig = '';
const hash = (str) => [...str].reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0).toString(36);

function bannerHtml(a) {
  // The Start page and the alert pages already show this, so no banner there (one warning, not three).
  if (state.settings.alerts === false || /^#\/(alerts|todo)?$|^$|^#$|^#\/todo\//.test(location.hash)) return '';
  if (!a.count && !a.news.length) return '';
  const sig = hash([...a.overdue, ...a.soon].map((x) => x.e.uid).concat(a.news.map((c) => c.uid + c.kind)).join('|'));
  if (sig === hiddenSig) return '';
  const urgent = a.soon.filter((x) => x.urgent).length;
  const later = a.soon.length - urgent;
  const parts = [];
  if (a.overdue.length) parts.push(`<b>${a.overdue.length}</b> overdue`);
  if (urgent) parts.push(`<b>${urgent}</b> due within 3 hours`);
  if (later) parts.push(`<b>${later}</b> due soon`);
  if (a.news.length) parts.push(`<b>${a.news.length}</b> new or changed`);
  const hot = a.overdue.length > 0 || urgent > 0;
  return `<div class="alertbar ${hot ? 'hot' : ''}" role="status"><span class="alertbar-text">${hot ? '⚠ ' : ''}${parts.join(' · ')}</span>
    <a class="btn small" href="#/alerts">Review</a><button class="alertbar-x" data-action="alerts-hide" data-sig="${sig}" aria-label="Hide for now">×</button></div>`;
}
actions['alerts-hide'] = (el) => {
  hiddenSig = el.dataset.sig;
  updateChrome();
};

function maybeNotify(a) {
  if (!state.settings.alertNotify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const fresh = [];
  for (const x of a.overdue) {
    if (state.notified[x.e.uid] !== 'overdue') { state.notified[x.e.uid] = 'overdue'; fresh.push(['overdue', x.e]); }
  }
  for (const x of a.soon) {
    if (!state.notified[x.e.uid]) { state.notified[x.e.uid] = 'soon'; fresh.push(['soon', x.e]); }
  }
  if (!fresh.length) return;
  save();
  if (!document.hidden) return; // someone is looking at the page, the banner already shows it
  const late = fresh.filter((f) => f[0] === 'overdue').length;
  const soon = fresh.length - late;
  const summary = [late ? `${late} overdue` : '', soon ? `${soon} due soon` : ''].filter(Boolean).join(', ');
  new Notification('Study Hub', { body: `${summary}: ${displayTitle(fresh[0][1].title)}${fresh.length > 1 ? ' and more' : ''}`, tag: 'study-hub-alerts' });
}

// Refresh everything that lives outside the page content. Cheap, so it runs after every render and once a minute.
function updateChrome() {
  const a = currentAlerts();
  const badge = document.getElementById('nav-todo');
  if (badge) {
    badge.textContent = a.count ? String(a.count) : '';
    badge.hidden = !a.count;
  }
  const bar = document.getElementById('alertbar');
  if (bar) bar.innerHTML = bannerHtml(a);
  const chip = document.getElementById('sync-chip');
  if (chip) {
    const cls = syncStatus.busy ? 'busy' : syncStatus.error ? 'err' : 'ok';
    chip.innerHTML = canSync() ? `<button class="chip-sync ${cls}" data-action="sync-bg" title="Sync from Toddle now"><i class="dot"></i>${esc(syncText())}</button>` : '';
  }
  const line = document.getElementById('sync-line');
  if (line) line.outerHTML = syncLineHtml();
  maybeNotify(a);
}

// ---- todo.js ----
// To-do list across all classes (Upcoming / Overdue / Done / Class material) and the one-time catch-up
// that sorts out work which was already past due when the calendar was first imported.






// ---------- catch-up ----------
function catchupItems() {
  return tasks().filter(isCatchup);
}

function catchupCard() {
  const items = catchupItems();
  if (!items.length) return '';
  return `<section class="card catchup">
    <div><h2>Catch up on ${items.length} older assignments</h2>
    <p class="muted">These were already past their due date when you imported your calendar. Toddle's feed doesn't say what you handed in, so most of them are probably done.</p></div>
    <div class="row"><button class="btn primary" data-action="catchup-all">Mark all as done</button><a class="btn" href="#/catchup">Go through them</a><button class="btn" data-action="catchup-keep">Keep them as to-dos</button></div>
  </section>`;
}

const markDoneQuietly = (uid) => {
  state.status[uid] = 'todo';
  state.done[uid] = 'bulk'; // 'bulk' so it doesn't count toward today's streak
};

actions['catchup-all'] = async () => {
  const items = catchupItems();
  if (!(await ask(`Mark ${items.length} older assignments as done? You can still change any of them later.`, { ok: 'Mark done' }))) return;
  items.forEach((e) => markDoneQuietly(e.uid));
  state.catchupBefore = null;
  save();
  toast(`Marked ${items.length} as done`);
  rerender();
};
actions['catchup-keep'] = () => {
  state.catchupBefore = null;
  save();
  rerender();
};
actions['catchup-set'] = (el) => {
  const { uid, s } = el.dataset;
  if (s === 'done') markDoneQuietly(uid);
  else setStatus(uid, s);
  save();
  rerender();
};

function catchupPage() {
  const items = catchupItems().sort((a, b) => b.date.localeCompare(a.date));
  if (!items.length) {
    if (state.catchupBefore) { state.catchupBefore = null; save(); }
    return '<h1>Catch up</h1>' + emptyState('✅', 'All sorted', 'Every older assignment has a status now.', '<a class="btn primary" href="#/">Back to Start</a>');
  }
  const by = {};
  items.forEach((e) => (by[e.classes[0] || ''] ||= []).push(e));
  const btn = (e, s, label, cls = '') => `<button class="btn small ${cls}" data-action="catchup-set" data-uid="${esc(e.uid)}" data-s="${s}">${label}</button>`;
  const groups = Object.keys(by).sort((a, b) => classInfo(a).name.localeCompare(classInfo(b).name)).map((c) => {

    return `<h3 class="day-h"><i class="dot" style="--c:${i.color}"></i> ${esc(i.name)} <span class="count">${by[c].length}</span></h3>
    <div class="card flush"><div class="alist">${by[c].map((e) => `
      <div class="arow"><div class="arow-main"><button class="task-title task-open linkish" data-action="open-task" data-uid="${esc(e.uid)}">${esc(displayTitle(e.title))}</button>
        <div class="task-meta">${tagsFor(e)}<span>${esc(dueText(e))}</span></div></div>
        <div class="arow-actions">${btn(e, 'done', 'Done', 'primary')}${btn(e, 'material', 'Not homework')}${btn(e, 'todo', 'Still to do')}</div></div>`).join('')}
    </div></div>`;
  }).join('');
  return `<div class="page-head"><div><h1>Catch up</h1><p class="muted">${items.length} left. Sort each one, or finish in one go.</p></div>
    <div class="row"><button class="btn primary" data-action="catchup-all">Mark the rest as done</button></div></div>${groups}`;
}

// ---------- to-do list ----------
const TABS = { upcoming: 'Upcoming', overdue: 'Overdue', done: 'Done', material: 'Class material' };
const f = { cls: '', teacher: '', type: '', q: '' };

changes['todo-filter'] = (el) => {
  f[el.dataset.k] = el.value;
  rerender();
};
inputs['todo-search'] = (el) => {
  f.q = el.value;
  const box = document.getElementById('todo-list');
  if (box) box.innerHTML = listHtml(currentTab);
};

let currentTab = 'upcoming';

function inTab(e, tab) {
  const k = kindOf(e);
  if (tab === 'material') return k === 'material';
  if (k !== 'todo') return false;
  if (tab === 'done') return isDone(e.uid);
  if (isDone(e.uid)) return false;
  return tab === 'overdue' ? isOverdue(e) : !isOverdue(e);
}

function filtered(tab) {
  const q = f.q.trim().toLowerCase();
  return tasks().filter((e) => inTab(e, tab)
    && (!f.cls || e.classes.includes(f.cls))
    && (!f.teacher || e.createdBy === f.teacher)
    && (!f.type || e.type === f.type)
    && (!q || (e.title + ' ' + e.description + ' ' + e.createdBy).toLowerCase().includes(q)));
}

function listHtml(tab) {
  const list = filtered(tab);
  if (!list.length) {
    const msg = { upcoming: 'Nothing coming up. Nice.', overdue: 'Nothing overdue.', done: 'Nothing ticked off yet.', material: 'No class material.' }[tab];
    return `<p class="muted pad">${msg}</p>`;
  }
  const t = today();
  const groups = new Map();
  const put = (k, e) => (groups.has(k) ? groups.get(k).push(e) : groups.set(k, [e]));
  if (tab === 'upcoming') {
    list.sort((a, b) => dueMs(a) - dueMs(b)).forEach((e) => {
      const d = diffDays(e.date, t);
      put(d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : d < 7 ? fmtDate(e.date, { weekday: 'long', day: 'numeric', month: 'short' }) : d < 14 ? 'Next week' : 'Later', e);
    });
  } else if (tab === 'overdue') {
    list.sort((a, b) => dueMs(b) - dueMs(a)).forEach((e) => put(diffDays(t, e.date) <= 7 ? 'This week' : 'Older', e));
  } else {
    list.sort((a, b) => b.date.localeCompare(a.date)).forEach((e) => put(new Date(e.date + 'T12:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), e));
  }
  return [...groups].map(([k, arr]) => `<h3 class="day-h">${esc(k)} <span class="count">${arr.length}</span></h3><div class="card flush"><div class="list">${arr.map((e) => taskRow(e, { showRel: tab !== 'done' })).join('')}</div></div>`).join('');
}

function todoPage(tab) {
  currentTab = TABS[tab] ? tab : 'upcoming';
  if (!state.events.length) return '<h1>To-do</h1>' + emptyState('📥', 'Nothing imported yet', 'Import your Toddle calendar to see your to-dos.', '<a class="btn primary" href="#/settings">Go to import</a>');
  const counts = Object.fromEntries(Object.keys(TABS).map((k) => [k, tasks().filter((e) => inTab(e, k)).length]));
  const tabs = Object.entries(TABS).map(([k, l]) => `<a class="tab ${k === currentTab ? 'active' : ''} ${k === 'overdue' && counts[k] ? 'tab-hot' : ''}" href="#/todo/${k}" ${k === currentTab ? 'aria-current="page"' : ''}>${l} <span class="count">${counts[k]}</span></a>`).join('');
  const all = tasks();
  const teachers = [...new Set(all.map((e) => e.createdBy).filter(Boolean))].sort();
  const types = [...new Set(all.map((e) => e.type))].sort();
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  return `<div class="page-head"><h1>To-do</h1><a class="btn small" href="#/catchup" ${state.catchupBefore ? '' : 'hidden'}>Catch up</a></div>
  <nav class="tabs left" aria-label="To-do lists">${tabs}</nav>
  <div class="filters">
    <select data-change="todo-filter" data-k="cls" aria-label="Class"><option value="">All classes</option>${classNames().map((c) => opt(c, classInfo(c).name, f.cls)).join('')}</select>
    <select data-change="todo-filter" data-k="teacher" aria-label="Teacher"><option value="">All teachers</option>${teachers.map((x) => opt(x, x, f.teacher)).join('')}</select>
    <select data-change="todo-filter" data-k="type" aria-label="Type"><option value="">All types</option>${types.map((x) => opt(x, x, f.type)).join('')}</select>
    <input type="search" data-input="todo-search" placeholder="Search…" value="${esc(f.q)}" aria-label="Search">
  </div>
  <div id="todo-list">${listHtml(currentTab)}</div>`;
}


// ---- drawer.js ----
// Task details in a side panel (full-screen sheet on small screens) instead of expanding rows inline.







let openUid = null;
let returnFocus = null;

const drawerUid = () => openUid;

function openTask(uid) {
  if (!openUid) returnFocus = document.activeElement;
  openUid = uid;
  renderDrawer();
  document.querySelector('.drawer')?.focus();
}

function closeTask() {
  if (!openUid) return;
  openUid = null;
  renderDrawer();
  if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
  returnFocus = null;
}

function planBlock(e) {
  const planned = state.plan[e.uid] || '';
  const t = today();
  const days = Array.from({ length: 21 }, (_, i) => addDays(t, i));
  if (planned && !days.includes(planned)) days.unshift(planned);
  const options = ['<option value="">Not planned</option>']
    .concat(days.map((d) => `<option value="${d}" ${d === planned ? 'selected' : ''}>${d === t ? 'Today' : fmtDate(d)}${d > e.date ? ' (after due date)' : ''}</option>`))
    .join('');
  return `<div class="form-row drawer-plan">
    <label class="field">Work on it<select data-change="plan-day" data-uid="${esc(e.uid)}">${options}</select></label>
    <label class="field">Minutes<input type="number" min="5" max="480" step="5" data-change="plan-est" data-uid="${esc(e.uid)}" value="${state.est[e.uid] || ''}" placeholder="${estOf(e.uid)}"></label>
  </div>`;
}

function drawerHtml(e) {
  const c = classInfo(e.classes[0] || '');
  const isTask = e.kind === 'task';
  const material = isTask && kindOf(e) === 'material';
  const done = isDone(e.uid);
  const left = dueMs(e) - Date.now();
  const when = !isTask || material || done ? '' : left < 0 ? `<span class="late">overdue by ${humanSpan(left)}</span>` : `<span class="muted">in ${humanSpan(left)}</span>`;
  const teacher = e.createdBy || (classTeachers(e.classes[0])[0] || '');
  const lesson = isTask ? nextLessonOf(e.classes[0]) : null;
  const decks = state.decks.filter((d) => d.link === e.uid);
  // Skip the description when it only repeats the links shown under Resources (e.g. "Slides: Cell Theory").
  const linkWords = new Set((e.links || []).flatMap((l) => [l.text, l.href]).filter(Boolean));
  const onlyLinks = (e.description || '').split('\n').map((x) => x.trim()).filter(Boolean).every((x) => linkWords.has(x));
  const body = onlyLinks ? '' : e.html || (e.description ? `<p>${linkify(e.description)}</p>` : '');
  return `
  <div class="drawer-backdrop" data-action="drawer-close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1" style="--c:${isTask ? c.color : 'var(--muted)'}">
    <div class="drawer-band"></div>
    <div class="drawer-top">
      <div>${isTask && e.classes[0] ? classLabel(e.classes[0]) : `<span class="muted small">${esc(e.type)}</span>`}</div>
      <button class="icon-btn" data-action="drawer-close" aria-label="Close">×</button>
    </div>
    <h2 id="drawer-title">${esc(displayTitle(e.title))}</h2>
    <div class="task-meta">${tagsFor(e)}</div>
    <dl class="facts">
      <dt>${isTask ? 'Due' : 'When'}</dt><dd>${esc(dueText(e))} ${when}</dd>
      ${teacher ? `<dt>Set by</dt><dd>${esc(teacher)}</dd>` : ''}
      ${isTask ? `<dt>Type</dt><dd>${esc(e.type)}</dd>` : ''}
      ${lesson ? `<dt>Next lesson</dt><dd>${esc(lesson.label)}</dd>` : ''}
      ${e.location ? `<dt>Where</dt><dd>${esc(e.location)}</dd>` : ''}
    </dl>
    ${isTask ? statusSeg(e) : ''}
    ${material ? '<p class="muted small">Class material: no warnings, not in the planner. Switch to "To do" if you do have to hand something in.</p>' : ''}
    ${(e.links || []).length ? `<h3 class="drawer-h">Resources</h3><div class="res-list">${resourceButtons(e)}</div>` : ''}
    ${body ? `<h3 class="drawer-h">Description</h3><div class="rich">${body}</div>` : isTask && !(e.links || []).length ? '<p class="muted">No description in Toddle.</p>' : ''}
    ${isTask && !material && !done ? `<h3 class="drawer-h">Plan</h3>${planBlock(e)}` : ''}
    <div class="drawer-actions">
      ${e.link ? `<a class="btn primary" href="${esc(e.link)}" target="_blank" rel="noopener noreferrer">Open in Toddle ↗</a>` : ''}
      ${isTask && !material ? `<button class="btn" data-action="plan-focus" data-cls="${esc(e.classes[0] || '')}">Start focus timer</button>` : ''}
      ${decks.map((d) => `<a class="btn" href="#/flashcards/${d.id}">Study cards: ${esc(d.name)}</a>`).join('')}
    </div>
  </aside>`;
}

function renderDrawer() {
  const host = document.getElementById('drawer');
  if (!host) return;
  const e = openUid && state.events.find((x) => x.uid === openUid);
  if (!e) {
    openUid = null;
    host.innerHTML = '';
    document.body.classList.remove('drawer-open');
    return;
  }
  const prev = host.querySelector('.drawer');
  const scroll = prev ? prev.scrollTop : 0;
  const hadFocus = prev && prev.contains(document.activeElement) ? document.activeElement.dataset.change || document.activeElement.dataset.s : null;
  host.innerHTML = drawerHtml(e);
  document.body.classList.add('drawer-open');
  const now = host.querySelector('.drawer');
  now.scrollTop = scroll;
  if (prev) {
    const again = hadFocus && host.querySelector(`[data-change="${hadFocus}"], [data-s="${hadFocus}"]`);
    (again || now).focus({ preventScroll: true });
  }
}

actions['open-task'] = (el) => openTask(el.dataset.uid);
actions['drawer-close'] = () => closeTask();
actions['set-status'] = (el) => {

  rerender();
};

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && openUid && !document.querySelector('dialog[open]')) closeTask();
  // keep Tab inside the panel while it is open
  if (ev.key === 'Tab' && openUid) {
    const panel = document.querySelector('.drawer');
    const items = panel ? [...panel.querySelectorAll('a[href], button, select, input, [tabindex="0"]')].filter((x) => !x.disabled) : [];
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === panel)) { last.focus(); ev.preventDefault(); }
    else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
  }
});
window.addEventListener('hashchange', () => openUid && closeTask());

// ---- calendar.js ----
// Calendar: month grid (holidays as continuous bars, assessments stand out) and a week view with time slots.







const now = new Date();
const cal = { y: now.getFullYear(), m: now.getMonth(), sel: today(), view: 'month', week: today() };

actions['cal-prev'] = () => {
  if (cal.view === 'week') cal.week = addDays(cal.week, -7);
  else if (--cal.m < 0) { cal.m = 11; cal.y--; }
  rerender();
};
actions['cal-next'] = () => {
  if (cal.view === 'week') cal.week = addDays(cal.week, 7);
  else if (++cal.m > 11) { cal.m = 0; cal.y++; }
  rerender();
};
actions['cal-today'] = () => {
  const d = new Date();
  cal.y = d.getFullYear(); cal.m = d.getMonth(); cal.sel = today(); cal.week = today();
  rerender();
};
actions['cal-select'] = (el) => { cal.sel = el.dataset.date; cal.week = el.dataset.date; rerender(); };
actions['cal-view'] = (el) => {
  cal.view = el.dataset.v;
  if (cal.view === 'week') cal.week = cal.sel;
  else { const d = parseYmd(cal.week); cal.y = d.getFullYear(); cal.m = d.getMonth(); }
  rerender();
};

const isOff = (e) => e.type === 'Holidays and vacations';
const isBand = (e) => e.kind === 'event' && (isOff(e) || e.endDate > e.date);
const visible = (e) => !(state.settings.hideClosures && isOff(e));

function eventsByDay() {
  const map = {};
  for (const e of state.events) {
    if (!visible(e)) continue;
    let d = e.date;
    for (let n = 0; n < 60 && d <= e.endDate; n++, d = addDays(d, 1)) (map[d] ||= []).push(e);
  }
  return map;
}

function chip(e) {
  if (e.kind !== 'task') return `<span class="cal-chip ev" style="--c:var(--accent)">${esc(displayTitle(e.title))}</span>`;
  const c = classColor(e.classes[0]);
  const cls = [isAssessment(e) ? (isSummative(e) ? 'strong' : 'formative') : '', isDone(e.uid) ? 'is-done' : '', kindOf(e) === 'material' ? 'mat' : ''].join(' ');
  return `<span class="cal-chip ${cls}" style="--c:${c}">${isAssessment(e) ? '★ ' : ''}${esc(displayTitle(e.title))}</span>`;
}

function monthView(map) {
  const ws = Number(state.settings.weekStart);
  const first = new Date(cal.y, cal.m, 1);
  const offset = (first.getDay() - ws + 7) % 7;
  const start = new Date(cal.y, cal.m, 1 - offset);
  const t = today();
  const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const heads = Array.from({ length: 7 }, (_, i) => `<div class="cal-dow">${names[(ws + i) % 7]}</div>`).join('');
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = ymd(d);
    const evs = map[key] || [];
    const bands = evs.filter(isBand).map((e) => {
      const first = key === e.date || i % 7 === 0;
      return `<span class="cal-band ${key === e.date ? 'b-start' : ''} ${key === e.endDate ? 'b-end' : ''} ${isOff(e) ? 'off' : ''}" title="${esc(e.title)}">${first ? esc(displayTitle(e.title)) : '&nbsp;'}</span>`;
    }).join('');
    const rest = evs.filter((e) => !isBand(e)).sort((a, b) => Number(isAssessment(b)) - Number(isAssessment(a)));
    const chips = rest.slice(0, 3).map(chip).join('');
    cells += `<button class="cal-cell ${d.getMonth() !== cal.m ? 'other' : ''} ${key === t ? 'today' : ''} ${key === cal.sel ? 'selected' : ''} ${evs.some(isOff) ? 'is-off' : ''}" data-action="cal-select" data-date="${key}" aria-label="${fmtDate(key)}, ${evs.length} events">
      <span class="cal-num">${d.getDate()}</span>${bands}<span class="cal-chips">${chips}</span>${rest.length > 3 ? `<span class="cal-more">+${rest.length - 3}</span>` : ''}</button>`;
  }
  return `<div class="cal">${heads}${cells}</div>`;
}

const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

// Side-by-side lanes for overlapping items in one day column.
function lanes(items) {
  const ends = [];
  for (const it of items.sort((a, b) => a.s - b.s || b.e - a.e)) {
    let lane = ends.findIndex((end) => end <= it.s);
    if (lane < 0) { lane = ends.length; ends.push(0); }
    ends[lane] = it.e;
    it.lane = lane;
  }
  items.forEach((it) => { it.of = ends.length; });
  return items;
}

function weekView(map) {
  const start = weekStartOf(cal.week);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const t = today();
  const timed = {};
  const allDay = {};
  let lo = 8 * 60;
  let hi = 17 * 60;
  for (const d of days) {
    const evs = map[d] || [];
    allDay[d] = evs.filter((e) => e.allDay || isBand(e));
    const items = evs.filter((e) => !e.allDay && !isBand(e)).map((e) => {
      const s = toMin(dueClock(e) || e.time);
      const end = e.endTime && e.endDate === e.date ? Math.max(toMin(e.endTime), s + 20) : s + 30;
      return { ev: e, s, e: end };
    });
    const tt = dayTimetable(d).lessons.map((l) => ({ ev: l, s: toMin(l.start), e: toMin(l.end), kind: 'lesson' }));
    for (const it of [...items, ...tt]) { lo = Math.min(lo, it.s); hi = Math.max(hi, it.e); }
    timed[d] = { items: lanes(items), lessons: tt };
  }
  lo = Math.floor(lo / 60) * 60;
  hi = Math.ceil(hi / 60) * 60;
  const PX = 1.1;
  const hours = [];
  for (let m = lo; m <= hi; m += 60) hours.push(m);
  const busy = busyWeeks().find((w) => w.start === start);
  const col = (d) => {
    const { items, lessons } = timed[d];
    const lessonHtml = lessons.map((l) => `<div class="wk-lesson" style="top:${(l.s - lo) * PX}px;height:${(l.e - l.s) * PX}px;--c:${l.ev.cls ? classColor(l.ev.cls) : 'var(--muted)'}" title="${esc(l.ev.name)} ${l.ev.start}–${l.ev.end}"><span>${esc(l.ev.cls ? classInfo(l.ev.cls).name : l.ev.name)}</span></div>`).join('');
    const itemHtml = items.map((it) => {
      const e = it.ev;
      const c = e.kind === 'task' ? classColor(e.classes[0]) : 'var(--accent)';
      const cls = [e.kind === 'task' && isAssessment(e) ? 'strong' : '', e.kind === 'task' && isDone(e.uid) ? 'is-done' : '', e.kind === 'task' && kindOf(e) === 'material' ? 'mat' : ''].join(' ');
      const w = 100 / it.of;
      return `<button class="wk-item ${cls}" data-action="open-task" data-uid="${esc(e.uid)}" style="top:${(it.s - lo) * PX}px;height:${Math.max(22, (it.e - it.s) * PX)}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px);--c:${c}">
        <b>${esc(fmtTime(dueClock(e) || e.time, state.settings.time24))}</b> ${esc(displayTitle(e.title))}</button>`;
    }).join('');
    return `<div class="wk-col ${d === t ? 'today' : ''}" style="height:${(hi - lo) * PX}px">${hours.map((m) => `<div class="wk-line" style="top:${(m - lo) * PX}px"></div>`).join('')}${lessonHtml}${itemHtml}</div>`;
  };
  return `
  ${busy ? `<p class="note">Busy week: ${busy.items.length} summatives (${busy.items.map((e) => esc(displayTitle(e.title))).join(', ')}).</p>` : ''}
  <div class="wk-scroll"><div class="wk">
    <div class="wk-corner"></div>
    ${days.map((d) => `<button class="wk-head ${d === t ? 'today' : ''} ${d === cal.sel ? 'selected' : ''}" data-action="cal-select" data-date="${d}"><span>${fmtDate(d, { weekday: 'short' })}</span><b>${parseYmd(d).getDate()}</b></button>`).join('')}
    <div class="wk-corner small muted">all day</div>
    ${days.map((d) => `<div class="wk-allday">${allDay[d].map((e) => (e.kind === 'task' ? `<button class="cal-chip ${isAssessment(e) ? 'strong' : ''}" data-action="open-task" data-uid="${esc(e.uid)}" style="--c:${classColor(e.classes[0])}">${esc(displayTitle(e.title))}</button>` : `<button class="cal-band b-start b-end ${isOff(e) ? 'off' : ''}" data-action="open-task" data-uid="${esc(e.uid)}">${esc(displayTitle(e.title))}</button>`)).join('')}</div>`).join('')}
    <div class="wk-times" style="height:${(hi - lo) * PX}px">${hours.map((m) => `<span style="top:${(m - lo) * PX}px">${fmtTime(`${String(m / 60).padStart(2, '0')}:00`, state.settings.time24)}</span>`).join('')}</div>
    ${days.map(col).join('')}
  </div></div>
  <p class="muted small">Toddle tasks sit at their due time. ${dayTimetable(days[0]).lessons.length || days.some((d) => dayTimetable(d).lessons.length) ? 'Shaded blocks are your lessons from Schedule.' : 'Link your timetable in Settings to see your lessons here too.'}</p>`;
}

function calendarPage() {
  const map = eventsByDay();
  const sel = (map[cal.sel] || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const title = cal.view === 'week'
    ? `${fmtDate(weekStartOf(cal.week), { day: 'numeric', month: 'short' })} – ${fmtDate(addDays(weekStartOf(cal.week), 6), { day: 'numeric', month: 'short', year: 'numeric' })}`
    : new Date(cal.y, cal.m, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const views = [['month', 'Month'], ['week', 'Week']].map(([k, l]) => `<button class="seg-btn ${cal.view === k ? 'on' : ''}" data-action="cal-view" data-v="${k}" aria-pressed="${cal.view === k}">${l}</button>`).join('');
  return `
  <div class="page-head"><h1>Calendar</h1>
    <div class="row"><div class="seg" role="group" aria-label="View">${views}</div>
      <button class="btn small" data-action="cal-prev" aria-label="Previous">‹</button><strong class="cal-title">${title}</strong><button class="btn small" data-action="cal-next" aria-label="Next">›</button><button class="btn small" data-action="cal-today">Today</button></div></div>
  ${state.events.length ? '' : '<p class="muted">Import your Toddle calendar in Settings to see assignments here.</p>'}
  ${cal.view === 'week' ? weekView(map) : monthView(map)}
  <p class="cal-key muted small"><span class="cal-chip strong" style="--c:var(--accent)">★ Assessment</span><span class="cal-chip" style="--c:var(--accent)">Homework / task</span><span class="cal-chip mat" style="--c:var(--accent)">Class material</span><span class="cal-band b-start b-end off">Day off</span></p>
  <section class="card"><h2>${fmtDate(cal.sel, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
    ${sel.length ? `<div class="list">${sel.map((e) => (e.kind === 'task' ? taskRow(e) : eventRow(e))).join('')}</div>` : '<p class="muted">Nothing on this day.</p>'}</section>`;
}

function nextAssessmentCard(open) {

  return `<section class="card hero" style="--c:${c.color}">

  </section>`;

function busyWeeksCard() {
  const weeks = busyWeeks().filter((w) => w.start >= weekStartOf(today())).slice(0, 2);
  if (!weeks.length) return '';
  return `<section class="card crunch"><h2>Busy weeks ahead</h2>${weeks.map((w) => `
    <div class="crunch-row"><strong>Week of ${fmtDate(w.start, { day: 'numeric', month: 'short' })}</strong> · ${plural(w.items.length, 'summative')}
      <div class="muted small">${w.items.map((e) => `${esc(displayTitle(e.title))} (${esc(classInfo(e.classes[0] || '').name)}, ${fmtDate(e.date, { weekday: 'short' })})`).join(' · ')}</div></div>`).join('')}

function atSchoolCard() {
  const t = today();
  const until = addDays(t, 21);
  const events = state.events.filter((e) => e.kind === 'event' && e.endDate >= t && e.date <= until && e.type !== 'Holidays and vacations');

  if (!events.length && !off) return '';
  const row = (e, label) => `<div class="mini-row"><span><span class="mini-title">${esc(displayTitle(e.title))}</span><span class="muted small">${esc(label || e.type)}</span></span><span class="mini-date">${e.date <= t ? 'Now' : fmtDate(e.date)}${e.endDate !== e.date ? ` – ${fmtDate(e.endDate)}` : ''}<br>${e.date > t ? esc(relDay(e.date)) : ''}</span></div>`;
  return `<section class="card"><h2>At school</h2>${events.map((e) => row(e)).join('')}${off ? row(off, 'Next time off') : ''}</section>`;

function startPage() {
  const t = today();
  const name = state.settings.name ? `, ${esc(state.settings.name)}` : '';

  const sync = syncLineHtml();
  const head = `<div class="page-head"><div><h1>${greeting()}${name}</h1><p class="muted">${fmtDate(t, { weekday: 'long', day: 'numeric', month: 'long' })}${sync ? ' · ' + sync : ''}</p></div>

  const open = todos().filter((e) => !isDone(e.uid));
  const a = currentAlerts();
  const upcoming = open.filter((e) => !isOverdue(e)).sort((x, y) => dueMs(x) - dueMs(y));
  const week = upcoming.filter((e) => e.date <= addDays(t, 7));
  const dueToday = upcoming.filter((e) => e.date === t);
  const plan = todaysPlan();
  const todayItems = [...new Map([...dueToday, ...plan.items.filter((e) => e.kind !== 'prep')].map((e) => [e.uid, e])).values()];

        ${todayItems.length || preps.length
          ? `<div class="list">${todayItems.map((e) => taskRow(e, { timeOnly: e.date === t })).join('')}${preps.map((e) => `<div class="trow"><span class="mat-lead">✎</span><div class="task-main"><span class="task-title">${esc(e.title)}</span><span class="task-meta">Revision session</span></div></div>`).join('')}</div>`
          : '<p class="muted">Nothing due or planned today.</p>'}</section>
      <section class="card"><div class="sec-head"><h2>This week</h2><a class="btn small" href="#/todo">All to-dos</a></div>${dayBlocks || '<p class="muted">Nothing else due this week.</p>'}</section>
    </div>
    <div>
      ${nextAssessmentCard(open)}

}

function criteriaStrip(name) {
  const list = tasksFor(name).filter((e) => isAssessment(e) && kindOf(e) === 'todo');
  const by = { A: [], B: [], C: [], D: [] };
  list.forEach((e) => criteriaOf(e.title).forEach((l) => by[l].push(e)));
  if (!Object.values(by).some((x) => x.length)) return '';
  const t = today();
  const box = (l) => {
    const items = by[l].sort((a, b) => a.date.localeCompare(b.date));
    const summ = items.filter(isSummative).length;
    const next = items.find((e) => e.date >= t);
    const last = [...items].reverse().find((e) => e.date < t);
    return `<div class="crit-box ${items.length ? '' : 'none'}"><span class="crit crit-${l}">${l}</span>
      <div><b>${items.length ? `${summ} summative${items.length - summ ? `, ${items.length - summ} formative` : ''}` : 'Not assessed yet'}</b>
      <div class="muted small">${next ? `Next: ${fmtDate(next.date)}` : last ? `Last: ${fmtDate(last.date)}` : ''}</div></div></div>`;
  };
  return `<section class="card"><h2>MYP criteria <span class="count">from task titles</span></h2><div class="crit-grid">${['A', 'B', 'C', 'D'].map(box).join('')}</div></section>`;
}

function filteredList(name) {
  const all = tasksFor(name);
  let list = all.filter((e) => {
    const k = kindOf(e);
    if (classFilter === 'material') return k === 'material';
    if (k === 'material') return classFilter === 'all';
    return classFilter === 'open' ? !isDone(e.uid) : classFilter === 'done' ? isDone(e.uid) : true;
  });
  if (typeFilter) list = list.filter((e) => e.type === typeFilter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter((e) => (e.title + ' ' + e.description + ' ' + e.createdBy).toLowerCase().includes(q));
  }
  return list;
}

function classListHtml(name, focusUid) {
  const list = filteredList(name);
  if (!list.length) return '<p class="muted">Nothing matches these filters.</p>';
  const row = (e, rel) => taskRow(e, { showClass: false, showRel: rel, focus: e.uid === focusUid });
  const section = (title, arr, rel) => (arr.length ? `<h3 class="day-h">${esc(title)} <span class="count">${arr.length}</span></h3><div class="card flush"><div class="list">${arr.map((e) => row(e, rel)).join('')}</div></div>` : '');
  if (groupBy === 'topic') {
    return topicGroups(list, (e) => displayTitle(e.title)).map((g) => section(g.label, g.items.sort((a, b) => a.date.localeCompare(b.date)), true)).join('')
      + '<p class="muted small">Topics are a guess from words that appear in several titles.</p>';
  }
  const t = today();
  const late = (e) => !isDone(e.uid) && kindOf(e) === 'todo' && isOverdue(e);
  const overdue = list.filter(late).reverse();
  const upcoming = list.filter((e) => !late(e) && !(e.date < t && (isDone(e.uid) || kindOf(e) === 'material')));
  const past = list.filter((e) => e.date < t && (isDone(e.uid) || kindOf(e) === 'material')).reverse();
  return section('Overdue', overdue, true) + section('Upcoming', upcoming, true) + section('Earlier', past, false);
}

function classPage(name, focusUid = '') {
  if (!classNames().includes(name)) return emptyState('🤔', 'Class not found', '<a href="#/classes">Back to classes</a>');
  if (focusUid) {
    // coming from an alert: make sure the filters cannot hide the task
    typeFilter = '';
    search = '';
    if (classFilter === 'done' || classFilter === 'material') classFilter = 'all';
  }
  if (shownClass !== name) groupBy = 'date';
  shownClass = name;
  const i = classInfo(name);
  const all = tasksFor(name);
  const types = [...new Set(all.map((e) => e.type))];
  const s = classStats(name);
  const teachers = classTeachers(name);
  const lesson = nextLessonOf(name);
  const materials = all.filter((e) => kindOf(e) === 'material').length;
  const chips = [['open', 'To do'], ['done', 'Done'], ['material', `Class material${materials ? ` · ${materials}` : ''}`], ['all', 'All']]
    .map(([k, l]) => `<button class="chip ${classFilter === k ? 'active' : ''}" data-action="class-filter" data-f="${k}">${l}</button>`).join('');
  const group = [['date', 'By date'], ['topic', 'By topic']]
    .map(([k, l]) => `<button class="seg-btn ${groupBy === k ? 'on' : ''}" data-action="class-group" data-g="${k}" aria-pressed="${groupBy === k}">${l}</button>`).join('');
  return `
  <a class="muted small back" href="#/classes">← All classes</a>
  <header class="class-hero" style="--c:${i.color}">
    <span class="cc-icon big" aria-hidden="true">${subjectIcon(name)}</span>
    <div class="grow">
      <h1>${esc(i.name)}</h1>
      <div class="muted">${esc(i.code)}${teachers.length ? ' · ' + esc(teachers.join(', ')) : ''}${lesson ? ` · Next lesson ${esc(lesson.label)}` : ''}</div>
      <div class="muted small">${s.done}/${s.total} done${s.overdue ? ` · <span class="late">${s.overdue} overdue</span>` : ''}</div>
    </div>
    <div class="row">
      ${s.overdue ? `<button class="btn small" data-action="class-mark-past" data-cls="${esc(name)}">Mark overdue as done</button>` : ''}
      <details class="more"><summary class="btn small">Colour</summary><div class="more-menu swatches">${PALETTE.map((c) => `<button class="swatch ${c === i.color ? 'active' : ''}" style="background:${c}" data-action="class-color" data-cls="${esc(name)}" data-color="${c}" aria-label="Colour ${c}"></button>`).join('')}</div></details>
    </div>
  </header>
  ${criteriaStrip(name)}
  <div class="filters">
    <div class="row">${chips}</div>
    <select data-change="type-filter" aria-label="Filter by type"><option value="">All types</option>${types.map((x) => `<option ${typeFilter === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <input type="search" data-input="search" placeholder="Search…" value="${esc(search)}" aria-label="Search assignments">
    <div class="seg" role="group" aria-label="Group">${group}</div>
  </div>
  <div id="class-list">${classListHtml(name, focusUid)}</div>`;
}

// ================= PROGRESS =================
function criteriaMatrix() {
  const names = classNames();
  const rows = names.map((c) => {
    const counts = { A: 0, B: 0, C: 0, D: 0 };
    tasksFor(c).filter((e) => isAssessment(e) && kindOf(e) === 'todo').forEach((e) => criteriaOf(e.title).forEach((l) => counts[l]++));
    return [c, counts];
  }).filter(([, n]) => Object.values(n).some(Boolean));
  if (!rows.length) return '';
  return `<section class="card"><h2>MYP criteria assessed <span class="count">from task titles</span></h2>
    <table class="matrix"><thead><tr><th></th>${['A', 'B', 'C', 'D'].map((l) => `<th><span class="crit crit-${l}">${l}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(([c, n]) => `<tr><th><a href="#/class/${encodeURIComponent(c)}"><i class="dot" style="--c:${classColor(c)}"></i>${esc(classInfo(c).name)}</a></th>${['A', 'B', 'C', 'D'].map((l) => `<td class="${n[l] ? '' : 'zero'}">${n[l] || '–'}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <p class="muted small">Counts summative and formative tasks whose title names a criterion ("Crit B", "Criteria CD", "B, C, D …").</p></section>`;
}

function progressPage() {
  if (!state.events.length) return '<h1>Progress</h1>' + importCta();
  const t = today();
  const now = Date.now();
  const all = todos();
  const dueNow = all.filter((e) => dueMs(e) <= now); // same rule as overdue everywhere else
  const doneAll = all.filter((e) => isDone(e.uid));
  const doneDue = dueNow.filter((e) => isDone(e.uid));
  const pct = dueNow.length ? Math.round((100 * doneDue.length) / dueNow.length) : 100;

  const rows = classNames().map((c) => {
    const i = classInfo(c);
    const list = todosFor(c);
    const n = list.length || 1;
    const d = list.filter((e) => isDone(e.uid)).length;
    const od = list.filter((e) => !isDone(e.uid) && isOverdue(e)).length;
    return `<div class="prog-row" style="--c:${i.color}"><div class="prog-name"><a href="#/class/${encodeURIComponent(c)}">${esc(i.name)}</a><span class="muted small">${d}/${list.length} done${od ? ` · <span class="late">${od} overdue</span>` : ''}</span></div>
      ${bar([{ v: (100 * d) / n, c: i.color, t: 'done' }, { v: (100 * od) / n, c: 'var(--bad)', t: 'overdue' }])}</div>`;
  }).join('');

  // study minutes, last 14 days
  const days = Array.from({ length: 14 }, (_, k) => addDays(t, k - 13));
  const mins = days.map(studyMinutesOn);
  const max = Math.max(30, ...mins);
  const chart = days.map((d, k) => `<div class="col" title="${fmtDate(d)}: ${mins[k]} min"><div class="col-bar" style="height:${(100 * mins[k]) / max}%"></div><span class="col-lab">${parseYmd(d).getDate()}</span></div>`).join('');

  const active = (d) => studyMinutesOn(d) > 0 || (state.reviews[d] || 0) > 0 || Object.values(state.done).includes(d);
  let streak = 0;
  for (let d = active(t) ? t : addDays(t, -1); active(d); d = addDays(d, -1)) streak++;
  const week = days.slice(7);
  const weekMin = week.reduce((a, d) => a + studyMinutesOn(d), 0);
  const weekCards = week.reduce((a, d) => a + (state.reviews[d] || 0), 0);
  const totalMin = state.sessions.reduce((a, s) => a + s.minutes, 0);

  const byClass = {};
  state.sessions.forEach((s) => (byClass[s.cls || ''] = (byClass[s.cls || ''] || 0) + s.minutes));
  const studyRows = Object.entries(byClass).sort((a, b) => b[1] - a[1]).map(([c, m]) => `<div class="mini-row" style="--c:${c ? classColor(c) : 'var(--accent)'}"><span class="mini-title">${c ? esc(classInfo(c).name) : 'General'}</span><span class="muted">${m} min</span></div>`).join('');

  return `
  <h1>Progress</h1>
  <div class="grid stats">
    <div class="card stat"><div class="stat-num">${pct}<small>%</small></div><div class="muted">of due work done</div></div>
    <div class="card stat"><div class="stat-num">${doneAll.length}<small>/${all.length}</small></div><div class="muted">to-dos done</div></div>
    <div class="card stat"><div class="stat-num">${streak}<small>d</small></div><div class="muted">day streak</div></div>
    <div class="card stat"><div class="stat-num">${Math.round(totalMin / 6) / 10}<small>h</small></div><div class="muted">total focus time</div></div>
  </div>
  <div class="grid two">
    <div>
      <section class="card"><h2>By class</h2>${rows}<p class="muted small"><span class="key" style="background:var(--accent)"></span>done <span class="key" style="background:var(--bad)"></span>overdue</p></section>
      ${criteriaMatrix()}
    </div>
    <div>
      <section class="card"><h2>Focus minutes, last 14 days</h2><div class="chart">${chart}</div>
        <p class="muted small">This week: ${weekMin} min focus · ${weekCards} flashcards reviewed</p></section>
      <section class="card"><h2>Focus time by class</h2>${studyRows || '<p class="muted">Finish a focus session to see it here.</p>'}</section>
    </div>
  </div>
  <p class="muted small">A streak counts any day you finished a focus session, reviewed flashcards or ticked off an assignment. Class material is not counted.</p>`;
}

actions['sync-now'] = async (el) => {
  const url = document.getElementById('feed-url').value.trim();
  state.feedUrl = url;
  save();
  el.disabled = true;
  el.textContent = 'Syncing…';
  try {
    const n = await syncFromFeed();
    syncStatus.error = null;
    toast(`Imported ${n} events`);
    prepareCatchup();
  } catch (e) {
    syncStatus.error = e.details ? `${e.message}\n\n${e.details}` : e.message;
    toast(e.message);
  }
  rerender();
};
actions['copy-error'] = async () => {
  try {
    await navigator.clipboard.writeText(syncStatus.error);
    toast('Copied');
  } catch (e) {
    toast('Could not copy automatically. Select the text and press Ctrl+C.');
  }
};
actions['clear-feed'] = async () => {
  if (!(await ask('Remove the saved link and all imported assignments? Your flashcards and study history stay.', { ok: 'Remove', danger: true }))) return;
  state.feedUrl = '';
  state.events = [];
  state.lastSync = null;
  state.pastPrompted = false;
  state.catchupBefore = null;
  save();
  rerender();
};
changes['upload-ics'] = async (el) => {
  const file = el.files[0];
  if (!file) return;
  try {
    const n = importText(await file.text());
    toast(`Imported ${n} events`);
    prepareCatchup();

changes['setting'] = (el) => {
  const k = el.dataset.setting;
  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(1, Number(el.value) || 1) : el.value;
  if (k === 'weekStart') v = Number(v);
  if (k === 'dueAtEnd') v = v === 'end';
  if (k === 'alertNotify' && v && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  state.settings[k] = v;
  dueConfig.end = Boolean(state.settings.dueAtEnd);
  save();
  applyTheme();
  syncDurations();
  rerender();
};
changes['tt-link'] = (el) => {
  state.ttMap[el.dataset.id] = el.value;
  save();
  rerender();
};
actions['unmute-all'] = () => {
  state.mute = {};
  save();
  rerender();
};
actions['accent'] = (el) => {
  state.settings.accent = el.dataset.color;
  save();
  applyTheme();
  rerender();
};
actions['export-data'] = () => {
  const { feedUrl, ...rest } = state;
  try { rest.scheduler = localStorage.getItem(SCHEDULER_KEY); } catch (e) { /* storage unavailable */ }
  download(`study-hub-backup-${today()}.json`, JSON.stringify(rest, null, 2));
};
changes['import-data'] = async (el) => {
  const file = el.files[0];
  el.value = '';
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
    if (typeof data !== 'object' || !Array.isArray(data.events)) throw new Error('bad');
  } catch (e) {
    return toast('That is not a valid backup file.');
  }
  if (!(await ask('Replace everything in this browser with the backup?', { ok: 'Replace', danger: true }))) return;
  const { scheduler, ...hubData } = data;
  replaceWith({ ...hubData, feedUrl: state.feedUrl });
  if (typeof scheduler === 'string') {
    try { localStorage.setItem(SCHEDULER_KEY, scheduler); } catch (e) { /* storage unavailable */ }
  }
  dueConfig.end = Boolean(state.settings.dueAtEnd);
  applyTheme();
  toast('Backup restored');
  rerender();
};
actions['reset-all'] = async () => {
  if (!(await ask('Delete ALL data in this browser (assignments, decks, schedule, history, settings)? This cannot be undone.', { ok: 'Delete everything', danger: true }))) return;
  resetAll();
  dueConfig.end = false;
  applyTheme();
  rerender();
};
actions['toggle-url'] = () => {
  const i = document.getElementById('feed-url');
  i.type = i.type === 'password' ? 'text' : 'password';
};

function applyTheme() {
  const r = document.documentElement;
  if (state.settings.theme === 'auto') r.removeAttribute('data-theme');
  else r.dataset.theme = state.settings.theme;
  r.style.setProperty('--accent', state.settings.accent);
}

    <label class="check-row"><input type="checkbox" data-change="setting" data-setting="planWeekends" ${chk('planWeekends')}> Auto-plan on weekends and school holidays</label>
    <label class="check-row"><input type="checkbox" data-change="setting" data-setting="prepSessions" ${chk('prepSessions')}> Add a revision session before each summative (3 days early in weeks with 2+ summatives)</label>
  </section>

  ${timetableCard()}

  <section class="card"><h2>Alerts and sync</h2>
    <label class="check-row"><input type="checkbox" data-change="setting" data-setting="alerts" ${chk('alerts')}> Warn me about overdue and upcoming work</label>
    <div class="form-row">
      <label class="field">Warn this many hours before something is due<input type="number" min="1" max="168" data-change="setting" data-setting="warnHours" value="${s.warnHours}"></label>
      <label class="field">Warn about assessments this many days ahead<input type="number" min="1" max="30" data-change="setting" data-setting="warnAssessDays" value="${s.warnAssessDays}"></label>
    </div>
    <label class="check-row"><input type="checkbox" data-change="setting" data-setting="alertNotify" ${chk('alertNotify')}> Show a browser notification for new warnings while the app is open in another tab</label>
    <label class="check-row"><input type="checkbox" data-change="setting" data-setting="autoSync" ${chk('autoSync')}> Sync from Toddle automatically when I open the app</label>
    <p class="muted small">Class material (slides, videos, feedback) never triggers warnings. Notifications only work while the app is open in a browser tab.${Object.keys(state.mute).length ? ` <button class="linkbtn" data-action="unmute-all">Stop ignoring ${Object.keys(state.mute).length} muted item(s)</button>` : ''}</p>
  </section>

  <section class="card"><h2>Your data</h2>
    <p class="muted">Everything lives in this browser. Export a backup to move to another device (your Toddle link is left out of backups).</p>
    <div class="row">
      <button class="btn" data-action="export-data">Export backup</button>
      <label class="btn">Restore backup<input type="file" accept=".json,application/json" data-change="import-data" hidden></label>
      <button class="btn danger" data-action="reset-all">Delete everything</button>
    </div>
  </section></div>`.replace(section === 'timetable' ? 'id="timetable"' : '\u0000', 'id="timetable" data-focus="1"');
}


// ---- app.js ----
// Router, shell and event delegation.











const view = document.getElementById('view');

const ROUTES = {
  '': { nav: 'start', page: startPage },
  alerts: { nav: 'todo', page: alertsPage },
  todo: { nav: 'todo', page: todoPage },
  catchup: { nav: 'todo', page: catchupPage },
  classes: { nav: 'classes', page: classesPage },
  class: { nav: 'classes', page: (a, b) => classPage(decodeURIComponent(a), b ? decodeURIComponent(b) : '') },
  calendar: { nav: 'calendar', page: calendarPage },
  planner: { nav: 'planner', page: plannerPage },
  schedule: { nav: 'schedule', page: schedulePage },
  timer: { nav: 'timer', page: timerPage },
  flashcards: { nav: 'flashcards', page: cardsPage },
  progress: { nav: 'progress', page: progressPage },
  settings: { nav: 'settings', page: (a) => settingsPage(a) },
};

function route() {
  const [name = '', a, b] = location.hash.replace(/^#\/?/, '').split('/');
  return { r: ROUTES[name] || ROUTES[''], a, b, name };
}

let freshNav = true; // true until the first render after a navigation, so a deep link can scroll to its target

function render() {
  const { r, a, b, name } = route();
  // Re-rendering would reload the scheduler frame and lose unsaved edits (e.g. when the timer ends).
  if (r.nav === 'schedule' && view.querySelector('.sched-frame')) {
    updateChrome();
    renderDrawer();
    return;
  }
  // Keep expanded assignment details and scroll position across re-renders.
  const open = new Set([...view.querySelectorAll('details[open][data-keep]')].map((d) => d.dataset.keep));
  const y = window.scrollY;
  view.innerHTML = r.page(a, b);
  const frame = view.querySelector('iframe[data-srcdoc]');
  if (frame) frame.srcdoc = window.SCHEDULER_SRCDOC;
  view.querySelectorAll('details[data-keep]').forEach((d) => open.has(d.dataset.keep) && (d.open = true));
  window.scrollTo(0, y);
  if (freshNav) {
    const target = view.querySelector('[data-focus]');
    if (target) target.scrollIntoView({ block: 'center' });
    // a link to a task inside a class (#/class/<class>/<uid>) also opens its details
    if (name === 'class' && b) openTask(decodeURIComponent(b));
    freshNav = false;
  }
  renderDrawer();
  document.querySelectorAll('[data-nav]').forEach((el) => el.classList.toggle('active', el.dataset.nav === r.nav));
  updateTimerUI();
  updateChrome();
}

setRender(render);

window.addEventListener('hashchange', () => {
  if (location.hash && !location.hash.startsWith('#/')) return; // e.g. the skip link
  window.scrollTo(0, 0);
  freshNav = true;
  render();
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]');
  if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e);
});

applyTheme();
render();

// ---- background sync and warnings ----
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');

async function sync(reason) {
  const before = backgroundSync(reason); // runs the request; the chip shows "Syncing…" meanwhile
  updateChrome();
  const result = await before;
  updateChrome();
  // Only redraw when something changed, and never while someone is typing (it would wipe their text).
  if (result && result.changed && !typing()) render();
}

sync('open');
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) sync('focus');
});
setInterval(() => sync('timer'), 30 * 60e3);
setInterval(updateChrome, 60e3); // warnings change as time passes, even without a sync

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

})();
</script>
