/* Colours, radii and shadows follow Toddle's own design tokens (web.toddleapp.com, Nov 2026):
   primary actions red-400, links blue-400, text neutral-100/400, borders neutral-800, tags 900-bg / 300-fg. */
:root {
  --bg: #fafafa; --card: #ffffff; --card-2: #f5f5f5; --hover: #f5f5f5; --text: #1f1f1f; --muted: #707070; --line: #e6e6e6; --line-bold: #cccccc;
  --accent: #d63a3f; --accent-hover: color-mix(in srgb, var(--accent) 78%, #000); --link: #008392;
  --selected: color-mix(in srgb, var(--accent) 9%, var(--card)); --selected-text: var(--accent);
  --good: #008768; --bad: #d63a3f; --warn: #b56000;
  --shadow: none; --shadow-hover: 0 2px 8px rgba(0, 0, 0, .1); --shadow-lg: 0 12px 24px rgba(0, 0, 0, .12);
  --radius: 12px; --radius-btn: 8px;
  --crit-a: #5a5ae2; --crit-b: #008768; --crit-c: #ca4f25; --crit-d: #a43dd7;
  --tag-red-bg: #ffd9da; --tag-red: #ad1d22; --tag-orange-bg: #ffe0d6; --tag-orange: #9f3c19; --tag-green-bg: #e3f1c3; --tag-green: #3e6100;
  --tag-blue-bg: #bffbfb; --tag-blue: #00616e; --tag-neutral-bg: #f5f5f5; --tag-neutral: #525252;
}
:root[data-theme="dark"] { --bg: #121212; --card: #1c1c1c; --card-2: #262626; --hover: #262626; --text: #f5f5f5; --muted: #adadad; --line: #333333; --line-bold: #525252; --link: #2addf1; --good: #04d4aa; --bad: #ff6169; --warn: #ffaa00; --shadow-hover: 0 2px 8px rgba(0, 0, 0, .5); --shadow-lg: 0 12px 24px rgba(0, 0, 0, .55); --crit-a: #8585ff; --crit-b: #04d4aa; --crit-c: #ff865d; --crit-d: #cc66ff; --tag-red-bg: #4a1517; --tag-red: #ffb2b6; --tag-orange-bg: #4a2316; --tag-orange: #ffc2ae; --tag-green-bg: #26350c; --tag-green: #c8e487; --tag-blue-bg: #003f49; --tag-blue: #7feaf6; --tag-neutral-bg: #262626; --tag-neutral: #ccc; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --card: #1c1c1c; --card-2: #262626; --hover: #262626; --text: #f5f5f5; --muted: #adadad; --line: #333333; --line-bold: #525252; --link: #2addf1; --good: #04d4aa; --bad: #ff6169; --warn: #ffaa00; --shadow-hover: 0 2px 8px rgba(0, 0, 0, .5); --shadow-lg: 0 12px 24px rgba(0, 0, 0, .55); --crit-a: #8585ff; --crit-b: #04d4aa; --crit-c: #ff865d; --crit-d: #cc66ff; --tag-red-bg: #4a1517; --tag-red: #ffb2b6; --tag-orange-bg: #4a2316; --tag-orange: #ffc2ae; --tag-green-bg: #26350c; --tag-green: #c8e487; --tag-blue-bg: #003f49; --tag-blue: #7feaf6; --tag-neutral-bg: #262626; --tag-neutral: #ccc; }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; font: 15px/1.5 "Avenir Next", "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; }
a { color: var(--link); }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; margin: .2rem 0 .8rem; line-height: 1.2; }
h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 .7rem; }
h3 { font-size: 1rem; font-weight: 750; margin: 0 0 .3rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .late { color: var(--bad); } .hidden { visibility: hidden; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; z-index: 99; background: var(--card); padding: .5rem; }

/* nav */
.nav { position: sticky; top: 0; height: 100vh; padding: 1.1rem .8rem; display: flex; flex-direction: column; gap: 3px; background: var(--card); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.1rem; padding: .3rem .6rem 1.1rem; }
.nav a { display: flex; align-items: center; gap: .75rem; padding: .6rem .8rem; border-radius: var(--radius-btn); color: var(--text); text-decoration: none; font-weight: 600; }
.nav a svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: var(--hover); }
.nav a.active { background: var(--selected); color: var(--selected-text); }
.nav a b { margin-left: auto; font: 700 .8rem/1 ui-monospace, monospace; color: var(--accent); }
.nav-end { margin-top: 0; }
.nav-sync { margin-top: auto; padding: 0 .25rem .4rem; min-height: 2rem; }
main { padding: 1.6rem clamp(1rem, 3vw, 2.6rem) 3rem; max-width: 1180px; width: 100%; }
#view { outline: none; }

/* layout bits */
.grid { display: grid; gap: 1.1rem; margin-bottom: 1.1rem; }
.grid.stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
.grid.classes, .grid.decks { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); margin-bottom: 1.1rem; }
.grid > .card { margin-bottom: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem; }
.page-head h1 { margin-bottom: .1rem; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; } .row.nowrap { flex-wrap: nowrap; } .center { justify-content: center; }
.stat { text-align: left; } .stat-num { font-size: 1.8rem; font-weight: 800; line-height: 1.1; } .stat-num small { font-size: .9rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
.stat.warn .stat-num { color: var(--bad); }
.lede { font-size: 1.05rem; margin: -.2rem 0 1.2rem; color: var(--muted); } .lede b { color: var(--text); } .lede a, .lede .linkbtn { font-weight: 700; }
.back { display: inline-block; margin-bottom: .5rem; }

/* buttons & forms */
.btn { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: var(--radius-btn); border: 1px solid var(--line); background: var(--card); color: var(--text); transition: background .12s, border-color .12s; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--line-bold); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); } .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; } .btn.danger-solid:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.small { padding: .32rem .75rem; font-size: .85rem; border-radius: 6px; } .btn.big { font-size: 1.15rem; padding: .8rem 2.2rem; }
.icon-btn { border: 0; background: var(--card-2); color: var(--muted); width: 2.2rem; height: 2.2rem; border-radius: 50%; font-size: 1.4rem; line-height: 1; cursor: pointer; } .icon-btn:hover { color: var(--text); }
:focus-visible { outline: 2px solid #00b0c2; outline-offset: 2px; }
input, select, textarea { font: inherit; padding: .55rem .75rem; border-radius: var(--radius-btn); border: 1px solid var(--line-bold); background: var(--card); color: var(--text); width: 100%; }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: .25rem; font-weight: 600; font-size: .9rem; margin-bottom: .8rem; } .field .muted { font-weight: 500; }
.field.grow, .grow { flex: 1 1 200px; } .center-field { max-width: 260px; margin: 1rem auto 0; }
.form-row { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-end; } .form-row .field { flex: 1 1 140px; }
.form-card { margin-top: 1rem; }
.check-row { display: flex; gap: .6rem; align-items: center; margin: .4rem 0; } .check-row input { width: auto; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); cursor: pointer; } .swatch.active { box-shadow: 0 0 0 3px var(--text); }
.swatches { display: grid; grid-template-columns: repeat(6, 34px); gap: .35rem; padding: .6rem; min-width: 0; }
.note { background: color-mix(in srgb, var(--warn) 12%, transparent); border-left: 4px solid var(--warn); padding: .7rem .9rem; border-radius: 10px; margin: 1rem 0; font-size: .92rem; }
.chip { font: inherit; font-size: .85rem; font-weight: 600; padding: .3rem .85rem; border-radius: 99px; border: 1px solid var(--line-bold); background: var(--card); color: var(--text); cursor: pointer; } .chip:hover { background: var(--hover); } .chip.active { background: var(--text); border-color: var(--text); color: var(--card); }
.filters { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: .5rem 0 1rem; } .filters select, .filters input { width: auto; flex: 1 1 140px; max-width: 220px; }
.tabs { display: flex; gap: .3rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; } .tabs.left { justify-content: flex-start; border-bottom: 1px solid var(--line); gap: .2rem; }
.tab { font: inherit; border: 0; background: transparent; color: var(--muted); padding: .4rem .9rem; border-radius: 99px; cursor: pointer; font-weight: 700; text-decoration: none; } .tab.active { background: var(--selected); color: var(--selected-text); }
.tabs.left .tab { border-radius: 0; padding: .55rem .9rem; border-bottom: 3px solid transparent; margin-bottom: -1px; } .tabs.left .tab.active { background: none; color: var(--text); border-bottom-color: var(--accent); }
.tab-hot .count { color: var(--bad); font-weight: 800; }
.seg { display: inline-flex; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--radius-btn); padding: 3px; gap: 2px; }
.seg-btn { font: inherit; font-size: .85rem; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: .3rem .8rem; border-radius: 6px; cursor: pointer; }
.seg-btn.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* rows */
.day-h { margin: 1.2rem 0 .4rem; font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: .35rem; } .day-h:first-child { margin-top: 0; }
.card > .day-h:first-of-type { margin-top: .2rem; }
.count { font-weight: 600; color: var(--muted); font-size: .85rem; margin-left: .25rem; text-transform: none; letter-spacing: 0; }
.card.flush { padding-top: .1rem; padding-bottom: .1rem; }
.list > :last-child { border-bottom: 0; }

.trow.is-mat .task-title { color: var(--muted); font-weight: 600; }

.mat-lead { flex: none; width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); margin-top: 2px; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.task-main { flex: 1; min-width: 0; }
.task-open { font: inherit; color: inherit; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: block; width: 100%; }
.task-open:hover .task-title, .task-open.task-title:hover { color: var(--link); }
.linkish { font-weight: 700; }
.task-title { font-weight: 700; overflow-wrap: anywhere; display: block; }
.task-meta { display: flex; gap: .25rem .75rem; flex-wrap: wrap; align-items: center; font-size: .82rem; color: var(--muted); margin-top: .15rem; } .due.late { color: var(--bad); font-weight: 650; }
.res-count { display: inline-flex; align-items: center; gap: .15rem; } .res-count .ico { width: 14px; height: 14px; }
.tag { font-size: .72rem; font-weight: 600; padding: .1rem .5rem; border-radius: 4px; background: var(--tag-blue-bg); color: var(--tag-blue); }
.t-summ { background: var(--tag-red-bg); color: var(--tag-red); } .t-form { background: var(--tag-orange-bg); color: var(--tag-orange); } .t-quick { background: var(--tag-green-bg); color: var(--tag-green); }
.t-mat { background: var(--tag-neutral-bg); color: var(--tag-neutral); }
.crit { display: inline-grid; place-items: center; min-width: 1.35rem; height: 1.35rem; padding: 0 .25rem; border-radius: 4px; font-size: .72rem; font-weight: 700; color: #fff; background: var(--muted); }
.crit-A { background: var(--crit-a); } .crit-B { background: var(--crit-b); } .crit-C { background: var(--crit-c); } .crit-D { background: var(--crit-d); }
.task-meta .crit + .crit { margin-left: -.55rem; }
.class-label { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); text-decoration: none; font-weight: 650; } a.class-label:hover { color: var(--text); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; display: inline-block; }
.ev-dot { flex: none; width: 22px; height: 22px; position: relative; } .ev-dot::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--accent); opacity: .5; } .ev-dot.off::after { background: var(--muted); }
.mini-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); width: 100%; } .mini-row:last-child { border-bottom: 0; } .mini-row:hover .mini-title { color: var(--link); }
.mini-row > span:first-child { display: flex; flex-direction: column; min-width: 0; } .mini-title { font-weight: 700; overflow-wrap: anywhere; } .mini-date { text-align: right; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; text-align: left; }
.pad { padding: 1rem 0; }

/* start */
.hero { border-top: 5px solid var(--c); }
.hero-label { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.hero-title { font-size: 1.25rem; font-weight: 800; margin: .25rem 0 .3rem; line-height: 1.3; }
.hero-count { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; margin: .8rem 0 .2rem; } .hero-count b { font-size: 2.4rem; line-height: 1; color: var(--c); font-weight: 700; } .hero-count span { font-weight: 700; } .hero-count .muted { font-weight: 500; width: 100%; font-size: .9rem; }
.hero-rest { margin-top: .8rem; border-top: 1px solid var(--line); }
.crunch { border-left: 4px solid var(--warn); } .crunch-row { padding: .4rem 0; }
.catchup { display: flex; gap: 1rem 1.5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--selected); border-color: color-mix(in srgb, var(--accent) 25%, var(--line)); }
.catchup > div:first-child { flex: 1 1 320px; } .catchup h2 { margin-bottom: .25rem; } .catchup p { margin: 0; }

/* classes */
.class-card, .deck { text-decoration: none; color: var(--text); display: block; transition: transform .12s, box-shadow .12s; }
.class-card:hover, .deck:hover { box-shadow: var(--shadow-hover); border-color: var(--line-bold); }
.deck { border-top: 5px solid var(--c); }
.class-card { padding: 0; overflow: hidden; }
.cc-banner { height: 84px; position: relative; background: var(--c); }
.cc-banner::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, .35) 0 18%, transparent 19%), radial-gradient(circle at 70% 110%, rgba(255, 255, 255, .2) 0 30%, transparent 31%); }
.cc-icon { position: absolute; left: 1.1rem; bottom: -22px; width: 48px; height: 48px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.5rem; box-shadow: var(--shadow); z-index: 1; }
.cc-icon.big { position: static; width: 64px; height: 64px; font-size: 2rem; border-radius: 50%; flex: none; background: color-mix(in srgb, var(--c) 18%, var(--card)); box-shadow: none; }
.cc-code { position: absolute; right: .8rem; top: .6rem; color: #fff; font-size: .78rem; font-weight: 800; background: rgba(0, 0, 0, .18); padding: .1rem .5rem; border-radius: 99px; z-index: 1; }
.cc-body { padding: 1.9rem 1.2rem 1.1rem; }
.cc-body h3 { font-size: 1.08rem; margin: 0; }
.cc-nums { display: flex; gap: .8rem; margin: .5rem 0 .3rem; font-size: .9rem; flex-wrap: wrap; }
.cc-next { margin-top: .3rem; }
.class-hero { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; padding: 1rem 1.2rem; margin-bottom: 1.1rem; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); }
.class-hero h1 { margin: 0; }
.crit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6rem; }
.crit-box { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem .7rem; border-radius: 12px; background: var(--card-2); } .crit-box .crit { width: 1.9rem; height: 1.9rem; font-size: .95rem; flex: none; } .crit-box.none { opacity: .6; } .crit-box.none .crit { background: var(--muted); }
.bar { display: flex; height: 9px; border-radius: 99px; background: var(--line); overflow: hidden; margin: .4rem 0; } .bar span { display: block; height: 100%; }
.deck-foot { display: flex; justify-content: space-between; margin-top: .8rem; font-size: .9rem; } .due-pill { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 .6rem; font-size: .8rem; font-weight: 800; }
.empty { text-align: center; padding: 2.5rem 1rem; } .empty-icon { font-size: 2.5rem; }
.matrix { width: 100%; border-collapse: collapse; font-size: .92rem; } .matrix th, .matrix td { padding: .4rem .3rem; border-bottom: 1px solid var(--line); text-align: center; } .matrix th:first-child { text-align: left; font-weight: 650; } .matrix th a { color: var(--text); text-decoration: none; display: inline-flex; gap: .4rem; align-items: center; } .matrix td { font-weight: 800; } .matrix td.zero { color: var(--muted); font-weight: 500; } .matrix tr:last-child > * { border-bottom: 0; }

/* calendar: month */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-bottom: .6rem; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.cal-dow { background: var(--card); text-align: center; font-size: .78rem; font-weight: 800; color: var(--muted); padding: .45rem 0; text-transform: uppercase; letter-spacing: .05em; }
.cal-cell { background: var(--card); border: 0; padding: .3rem 0; min-height: 104px; text-align: left; font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.cal-cell > .cal-num, .cal-cell > .cal-chips, .cal-cell > .cal-more { margin: 0 .3rem; }
.cal-cell.other { background: color-mix(in srgb, var(--bg) 70%, var(--card)); color: var(--muted); } .cal-cell:hover { background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
.cal-cell.is-off { background: repeating-linear-gradient(135deg, var(--card) 0 8px, color-mix(in srgb, var(--muted) 7%, var(--card)) 8px 9px); }
.cal-cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; } .cal-cell.today .cal-num { background: var(--accent); color: #fff; }
.cal-num { font-size: .8rem; font-weight: 800; width: 1.6rem; height: 1.6rem; display: grid; place-items: center; border-radius: 50%; }
.cal-chip { font-size: .7rem; font-weight: 650; line-height: 1.3; padding: 1px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent); border-left: 3px solid var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-family: inherit; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; }
.cal-chip.strong { background: var(--c); color: #fff; font-weight: 800; border-left-color: color-mix(in srgb, var(--c) 70%, #000); }
.cal-chip.formative { background: color-mix(in srgb, var(--c) 32%, transparent); font-weight: 800; }
.cal-chip.mat { background: transparent; border-left-style: dotted; color: var(--muted); }
.cal-chip.ev { border-left-style: dashed; }
.cal-chip.is-done { text-decoration: line-through; opacity: .5; }
.cal-band { display: block; font-size: .68rem; font-weight: 800; line-height: 1.5; padding: 0 .4rem; background: color-mix(in srgb, var(--accent) 22%, var(--card)); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; font-family: inherit; text-align: left; }
.cal-band.off { background: color-mix(in srgb, var(--muted) 24%, var(--card)); }
.cal-band.b-start { margin-left: .3rem; border-top-left-radius: 6px; border-bottom-left-radius: 6px; } .cal-band.b-end { margin-right: .3rem; border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.cal-chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-more { font-size: .7rem; color: var(--muted); font-weight: 700; } .cal-title { min-width: 9.5rem; text-align: center; }
.cal-key { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 0 1.1rem; } .cal-key .cal-chip, .cal-key .cal-band { display: inline-block; margin: 0; }

/* calendar: week */
.wk-scroll { overflow-x: auto; margin-bottom: .6rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
.wk { display: grid; grid-template-columns: 3.6rem repeat(7, minmax(110px, 1fr)); min-width: 820px; }
.wk-corner { border-bottom: 1px solid var(--line); padding: .3rem; font-size: .7rem; display: flex; align-items: flex-end; }
.wk-head { border: 0; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--card); color: var(--muted); font: inherit; padding: .45rem; display: flex; gap: .4rem; align-items: baseline; justify-content: center; cursor: pointer; }
.wk-head b { color: var(--text); font-size: 1.15rem; } .wk-head.today b { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 .45rem; } .wk-head.selected { background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
.wk-allday { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: .25rem; display: flex; flex-direction: column; gap: 2px; min-height: 1.8rem; min-width: 0; }
.wk-allday .cal-band { margin: 0; border-radius: 6px; cursor: pointer; }
.wk-allday .cal-chip { cursor: pointer; }
.wk-times { position: relative; } .wk-times span { position: absolute; right: .4rem; transform: translateY(-50%); font-size: .7rem; color: var(--muted); } .wk-times span:first-child { transform: none; }
.wk-col { position: relative; border-left: 1px solid var(--line); } .wk-col.today { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.wk-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); opacity: .7; }
.wk-lesson { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--c) 9%, transparent); border-top: 1px solid color-mix(in srgb, var(--c) 30%, transparent); font-size: .65rem; color: var(--muted); padding: 1px 4px; overflow: hidden; }
.wk-item { position: absolute; font: inherit; font-size: .72rem; line-height: 1.25; text-align: left; padding: 2px 5px; border-radius: 6px; border: 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--card)); color: var(--text); overflow: hidden; cursor: pointer; z-index: 1; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.wk-item.strong { background: var(--c); color: #fff; font-weight: 800; } .wk-item.is-done { opacity: .5; text-decoration: line-through; } .wk-item.mat { background: var(--card); border-left-style: dotted; color: var(--muted); }
.wk-item:hover { z-index: 2; box-shadow: var(--shadow-lg); }

/* timer */
.timer-wrap { max-width: 460px; margin: 0 auto 1rem; text-align: center; }
.ring-box { position: relative; width: min(280px, 80vw); margin: .5rem auto 1.2rem; } .ring { width: 100%; display: block; } .ring-bg { fill: none; stroke: var(--line); stroke-width: 12; } .ring-fg { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring-text { position: absolute; inset: 0; display: grid; place-content: center; } .time-big { font: 700 3.2rem/1 ui-monospace, "SF Mono", Menlo, monospace; }

/* progress */
.prog-row { margin-bottom: .9rem; } .prog-name { display: flex; justify-content: space-between; gap: .5rem; font-weight: 700; } .prog-name a { color: var(--text); text-decoration: none; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 8px; }
.chart { display: flex; gap: 4px; align-items: flex-end; height: 140px; margin: .5rem 0; } .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; } .col-bar { width: 100%; background: var(--accent); border-radius: 5px 5px 0 0; min-height: 2px; } .col-lab { font-size: .65rem; color: var(--muted); margin-top: 2px; }

/* flashcards */
.flashcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .6rem; width: 100%; min-height: 280px; padding: 2rem; margin: 1rem 0; border-radius: 22px; border: 2px solid var(--line); background: var(--card); color: var(--text); font: inherit; cursor: pointer; box-shadow: var(--shadow); } .flashcard.flipped { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
.fc-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); } .fc-text { font-size: clamp(1.3rem, 3.5vw, 2rem); font-weight: 700; text-align: center; overflow-wrap: anywhere; white-space: pre-wrap; }
.study-done { text-align: center; max-width: 480px; margin: 2rem auto; }
.card-list { display: flex; flex-direction: column; gap: .4rem; margin-top: 1rem; } .card-item { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: .6rem .9rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; } .card-item > div:first-child { min-width: 0; overflow-wrap: anywhere; }
.card-item.card-edit { align-items: flex-end; border-color: var(--accent); } .card-edit .field { margin: 0; }
.box-pill { font-size: .7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 .5rem; } .footer-row { margin-top: 1.5rem; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: .65rem 1.1rem; border-radius: 12px; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; max-width: 90vw; font-size: .9rem; font-weight: 650; } #toast.show { opacity: 1; transform: translate(-50%, 0); }

/* dialogs */
.dlg { border: 1px solid var(--line); border-radius: 18px; padding: 1.3rem 1.4rem 1.1rem; background: var(--card); color: var(--text); box-shadow: var(--shadow-lg); width: min(440px, calc(100vw - 2rem)); }
.dlg::backdrop { background: rgba(15, 17, 30, .45); }
.dlg p { margin: 0 0 1.1rem; } .dlg-actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }

/* task drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(15, 17, 30, .35); z-index: 60; animation: fade .15s ease-out; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--card); z-index: 61; overflow-y: auto; padding: 0 1.5rem 2rem; box-shadow: var(--shadow-lg); outline: none; animation: slide .18s ease-out; }
.drawer-band { height: 6px; margin: 0 -1.5rem; background: var(--c); position: sticky; top: 0; z-index: 1; }
.drawer-top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0 .3rem; }
.drawer h2#drawer-title { font-size: 1.4rem; margin: .2rem 0 .4rem; line-height: 1.3; }
.drawer-h { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 1.3rem 0 .5rem; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 1rem 0; font-size: .92rem; } .facts dt { color: var(--muted); font-weight: 650; } .facts dd { margin: 0; font-weight: 650; }
.drawer .seg { margin: .2rem 0 .4rem; } .drawer .seg-btn { padding: .4rem .95rem; }
.res-list { display: flex; flex-direction: column; gap: .4rem; }
.res { display: flex; align-items: center; gap: .7rem; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); background: var(--card); } .res:hover { background: var(--hover); border-color: var(--line-bold); }
.res .ico { width: 22px; height: 22px; color: var(--link); } .res span { display: flex; flex-direction: column; min-width: 0; } .res small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-slides .ico { color: #d97706; } .res-doc .ico { color: #2563eb; } .res-sheet .ico { color: #16a34a; } .res-form .ico { color: #7c3aed; } .res-video .ico { color: #dc2626; }
.rich { font-size: .95rem; overflow-wrap: anywhere; } .rich p { margin: 0 0 .7rem; } .rich ul, .rich ol { padding-left: 1.3rem; margin: 0 0 .7rem; }
.drawer-plan .field { margin-bottom: 0; }
.drawer-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
body.drawer-open { overflow: hidden; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 900px) { .grid.two { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; padding-bottom: 66px; }
  .nav { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; justify-content: space-around; padding: .3rem; border-right: 0; border-top: 1px solid var(--line); z-index: 20; gap: 0; }
  .brand { display: none; } .nav { padding: .3rem .1rem; } .nav a { flex-direction: column; gap: .1rem; padding: .3rem 0; font-size: .58rem; flex: 1 1 0; min-width: 0; align-items: center; } .nav a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; } .nav a b { margin: 0; position: absolute; transform: translateY(-14px); font-size: .6rem; } .nav-end { margin-top: 0; }
  main { padding-top: 1rem; } h1 { font-size: 1.45rem; }
  .cal-cell { min-height: 58px; } .cal-chip { font-size: 0; padding: 0; width: 8px; height: 8px; border-radius: 50%; border: 0; background: var(--c); display: inline-block; margin-right: 2px; } .cal-chips { flex-direction: row; flex-wrap: wrap; } .cal-more { display: none; } .cal-band { font-size: 0; height: 5px; }
  .cal-key .cal-chip { font-size: .7rem; width: auto; height: auto; padding: 1px 6px; border-radius: 5px; } .cal-key .cal-band { font-size: .68rem; height: auto; }
  .drawer { width: 100vw; padding: 0 1rem 2rem; } .drawer-band { margin: 0 -1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.note.err { background: color-mix(in srgb, var(--bad) 10%, transparent); border-left-color: var(--bad); }
.note pre { white-space: pre-wrap; word-break: break-all; user-select: text; font: .8rem/1.5 ui-monospace, Menlo, monospace; margin: .5rem 0; }

.sched-frame { width: 100%; height: calc(100vh - 8rem); min-height: 560px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); display: block; }
@media (max-width: 760px) { .sched-frame { height: calc(100vh - 10rem); } }

.narrow { max-width: 780px; }
.note.info { background: color-mix(in srgb, var(--link) 9%, transparent); border-left-color: var(--link); }

/* planner */
.pweek { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem; align-items: start; margin-bottom: 1rem; }
@media (min-width: 1180px) { .pweek { grid-template-columns: var(--cols, repeat(7, minmax(0, 1fr))); } }
.pday { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .65rem; min-height: 170px; display: flex; flex-direction: column; gap: .4rem; box-shadow: var(--shadow); }
.pday.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pday.weekend { background: color-mix(in srgb, var(--bg) 55%, var(--card)); box-shadow: none; }
.pday-head { display: flex; flex-direction: column; gap: .05rem; font-size: .9rem; }
.p-off { font-size: .75rem; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); border-radius: 6px; padding: .15rem .45rem; }
.p-lessons { display: flex; flex-wrap: wrap; gap: 3px; }
.lesson-pill { font-size: .66rem; font-weight: 700; padding: 0 .4rem; border-radius: 99px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--text); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.over { color: var(--warn); font-weight: 700; }
[data-drop].drop-on { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .5rem; margin: .4rem 0 .6rem; }
.p-main { flex: 1; min-width: 0; } .p-main summary { cursor: pointer; list-style: none; } .p-main summary::-webkit-details-marker { display: none; }
.p-edit { padding-top: .5rem; display: flex; flex-direction: column; gap: .4rem; } .p-edit .field { margin: 0; font-size: .75rem; }
.due-mark { font-size: .72rem; color: var(--muted); border-left: 3px solid var(--bad); padding-left: .4rem; overflow-wrap: anywhere; } .due-mark b { color: var(--bad); }

/* flashcard study modes */
.quiz { max-width: 640px; margin: 1rem auto; text-align: center; display: flex; flex-direction: column; gap: .8rem; padding: 1.5rem; }
.quiz input { text-align: center; font-size: 1.1rem; }
.mc-list { display: grid; gap: .5rem; }
.mc-opt { justify-content: flex-start; text-align: left; padding: .7rem 1rem; }
.mc-key { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 6px; background: var(--line); font-size: .75rem; color: var(--muted); flex: none; }
.mc-opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.mc-opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.mc-opt:disabled { opacity: 1; cursor: default; }
.verdict { font-weight: 800; font-size: 1.1rem; } .v-correct { color: var(--good); } .v-almost { color: var(--warn); } .v-wrong { color: var(--bad); }
.answer-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; text-align: left; overflow-wrap: anywhere; }
.answer-cmp .fc-label { display: block; }
.prev-row { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; border-bottom: 1px solid var(--line); font-size: .85rem; overflow-wrap: anywhere; }
.study-opts { margin-top: 1rem; }
@media (max-width: 380px) { .nav a { font-size: .52rem; } }
.pcard { padding: .5rem .6rem; border: 1px solid var(--line); border-left: 3px solid var(--c, var(--accent)); border-radius: 10px; background: var(--card); cursor: grab; }
.pcard.prep { border-left-style: dashed; background: color-mix(in srgb, var(--c) 6%, var(--card)); }
.pcard.is-done { opacity: .55; } .pcard.dragging { opacity: .35; }
.p-title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: .84rem; line-height: 1.25; font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
.p-meta { display: flex; align-items: center; gap: .4rem; margin-top: .35rem; min-width: 0; font-size: .72rem; color: var(--muted); }
.p-meta .check { width: 16px; height: 16px; border-radius: 5px; font-size: .6rem; margin: 0; }
.p-cls { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-min { margin-left: auto; white-space: nowrap; }
.p-flag { display: inline-block; margin-top: .3rem; font-size: .68rem; font-weight: 800; color: var(--warn); }
.p-due { display: inline-block; margin-top: .3rem; font-size: .68rem; font-weight: 700; color: var(--muted); }

/* alerts */
.alertbar { display: flex; align-items: center; gap: .75rem; padding: .6rem .9rem; margin-bottom: 1rem; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-left: 4px solid var(--warn); border-radius: var(--radius); background: color-mix(in srgb, var(--warn) 9%, var(--card)); }
.alertbar.hot { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--card)); }
.alertbar-text { flex: 1; font-size: .92rem; } .alertbar-x { border: 0; background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0 .25rem; }
.nav a b.count-badge { margin-left: auto; min-width: 1.25rem; padding: .05rem .4rem; border-radius: 99px; background: var(--bad); color: #fff; font: 700 .7rem/1.3 "Avenir Next", "Nunito Sans", system-ui, sans-serif; text-align: center; }
.nav a b.count-badge[hidden] { display: none; }
.alist > .arow { border-bottom: 1px solid var(--line); } .alist > .arow:last-child { border-bottom: 0; }
.arow { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: .7rem 0; }
.arow-main { min-width: 0; flex: 1; } .arow .task-title { text-decoration: none; color: var(--text); } .arow .task-title:hover { color: var(--link); }
.arow-actions { display: flex; align-items: center; gap: .4rem; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.soonc { color: var(--warn); font-weight: 700; } .arow.hot .late { font-weight: 700; }
.more { position: relative; } .more > summary { list-style: none; cursor: pointer; } .more > summary::-webkit-details-marker { display: none; }
.more-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; min-width: 190px; padding: .3rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.more-menu.swatches { display: grid; min-width: 0; }
.more-menu a, .more-menu button:not(.swatch) { text-align: left; font: inherit; font-size: .88rem; padding: .45rem .6rem; border: 0; background: none; color: var(--text); border-radius: 8px; cursor: pointer; text-decoration: none; } .more-menu a:hover, .more-menu button:not(.swatch):hover { background: var(--bg); }
.chip-sync { display: inline-flex; align-items: center; gap: .45rem; width: 100%; font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 0; padding: .3rem .5rem; border-radius: 8px; cursor: pointer; text-align: left; } .chip-sync:hover { background: var(--bg); color: var(--text); }
.chip-sync .dot { --c: var(--good); } .chip-sync.busy .dot { --c: var(--accent); animation: pulse 1s infinite; } .chip-sync.err { color: var(--bad); } .chip-sync.err .dot { --c: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
.flash { animation: flash 2.4s ease-out; border-radius: 8px; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
.attn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
@media (max-width: 760px) { .nav-sync { display: none; } .nav a b.count-badge { position: absolute; transform: translate(14px, -12px); margin: 0; } .arow { flex-direction: column; gap: .5rem; } .arow-actions { justify-content: flex-start; } .alertbar { flex-wrap: wrap; } }
</style>

"print\">Print<\/button>\n      <button class=\"btn sm\" data-a=\"theme\" id=\"themeBtn\">Theme<\/button>\n    <\/div>\n    <input type=\"file\" id=\"file\" accept=\"application/json,.json\" hidden>\n  <\/div>\n<\/header>\n<main class=\"wrap\" id=\"main\"><\/main>\n\n<div class=\"overlay\" id=\"overlay\" hidden>\n  <div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"edTitle\" id=\"modal\"><\/div>\n<\/div>\n<div id=\"toast\" role=\"status\" hidden><\/div>\n\n<script>\n(() => {\n'use strict';\n\n/* ---------- embedded in Study Hub (frame carries data-hub / data-theme / data-accent) ---------- */\nconst FRAME = (() => { try { return window.frameElement; } catch (e) { return null; } })();\nconst EMBED = !!(FRAME && FRAME.dataset.hub === '1');\nif (EMBED) {\n  const root = document.documentElement;\n  root.classList.add('embed');\n  if (FRAME.dataset.accent) { root.style.setProperty('--accent', FRAME.dataset.accent); root.style.setProperty('--accent-ink', '#fff'); }\n}\n\n/* ---------- constants & helpers ---------- */\nconst DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst DAYNAME = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};\nconst TYPES = {\n  period:   {label:'Class period', len:50},\n  lunch:    {label:'Lunch', len:30},\n  break:    {label:'Break', len:10},\n  homeroom: {label:'Homeroom / Advisory', len:20},\n  assembly: {label:'Assembly', len:40},\n  passing:  {label:'Passing time', len:5},\n  custom:   {label:'Custom', len:15}\n};\nconst PALETTE = ['#2563eb','#dc2626','#15803d','#9333ea','#c2410c','#0e7490','#be185d','#4d7c0f','#4338ca','#b45309','#0f766e','#475569'];\nconst KEY = 'classScheduler.v2', KEY_V1 = 'classScheduler.v1';\nconst SCALE = 1.15; // px per minute on the calendar\n\nconst uid = () => Math.random().toString(36).slice(2, 10);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst clone = o => JSON.parse(JSON.stringify(o));\nconst clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));\nconst gcd = (a, b) => b ? gcd(b, a % b) : a;\nconst TIME_RE = /^([01]\\d|2[0-3]):[0-5]\\d$/;\nconst toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };\nconst fromMin = n => { n = clamp(Math.round(n), 0, 1439); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };\nfunction ink(hex) {\n  const m = /^#?([0-9a-f]{6})$/i.exec(hex); if (!m) return '#fff';\n  const n = parseInt(m[1], 16), f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };\n  const L = .2126 * f(n >> 16) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);\n  return L > 0.179 ? '#111' : '#fff';\n}\n\n/* ---------- schedule data model ----------\n   class.sched = { hoursMode:'all'|'perDay', all:{start,end}, days:{Mon:{on,start,end}...}, tl:[week 0..4][day] -> blocks }\n   block = { id, type, name, start, end, meets }                                                   */\nfunction blankSched() {\n  const days = {};\n  DAYS.forEach((d, i) => { days[d] = {on: i < 5, start: '08:00', end: '15:00'}; });\n  return {hoursMode: 'all', all: {start: '08:00', end: '15:00'}, days, tl: Array.from({length: 5}, () => Object.fromEntries(DAYS.map(d => [d, []])))};\n}\nfunction sanitizeBlock(b) {\n  if (!b || !TYPES[b.type] || !TIME_RE.test(b.start) || !TIME_RE.test(b.end)) return null;\n  return {id: uid(), type: b.type, name: String(b.name || '').slice(0, 60), start: b.start, end: b.end, meets: b.type === 'period' && !!b.meets};\n}\nfunction sanitizeSched(x) {\n  const out = blankSched();\n  if (!x || typeof x !== 'object') return out;\n  out.hoursMode = x.hoursMode === 'perDay' ? 'perDay' : 'all';\n  if (x.all && TIME_RE.test(x.all.start) && TIME_RE.test(x.all.end)) out.all = {start: x.all.start, end: x.all.end};\n  DAYS.forEach(d => {\n    const s = x.days && x.days[d];\n    out.days[d] = {on: s ? !!s.on : out.days[d].on, start: s && TIME_RE.test(s.start) ? s.start : out.all.start, end: s && TIME_RE.test(s.end) ? s.end : out.all.end};\n    for (let w = 0; w < 5; w++) {\n      const arr = x.tl && x.tl[w] && x.tl[w][d];\n      out.tl[w][d] = Array.isArray(arr) ? arr.map(sanitizeBlock).filter(Boolean) : [];\n    }\n  });\n  return out;\n}\nconst cmpBlock = (a, b) => toMin(a.start) - toMin(b.start) || toMin(a.end) - toMin(b.end);\nfunction numbered(blocks) { let n = 0; return [...blocks].sort(cmpBlock).map(b => ({...b, num: b.type === 'period' ? ++n : 0})); }\nconst blockLabel = b => b.type === 'period' ? 'P' + b.num + (b.name ? ' · ' + b.name : '') : (b.name || TYPES[b.type].label);\nconst cloneBlocks = arr => arr.map(b => ({...b, id: uid()}));\nconst activeDays = c => DAYS.filter(d => c.sched.days[d].on);\n\n/* ---------- state, storage, migration ---------- */\nfunction newState() { return {v: 2, h24: false, theme: null, templates: [], classes: []}; }\nfunction migrateSched(school, c) {\n  const sc = blankSched(), def = school.default;\n  DAYS.forEach(d => {\n    const dd = (school.days && school.days[d]) || {on: false};\n    const tpl = dd.custom && dd.tpl && Array.isArray(dd.tpl.blocks) ? dd.tpl : def;\n    sc.days[d] = {on: !!dd.on, start: TIME_RE.test(tpl.start) ? tpl.start : '08:00', end: TIME_RE.test(tpl.end) ? tpl.end : '15:00'};\n    const nb = numbered((tpl.blocks || []).map(sanitizeBlock).filter(Boolean));\n    for (let w = 0; w < 5; w++) {\n      const g = c.grid && c.grid[w] && c.grid[w][d];\n      sc.tl[w][d] = nb.map(b => ({id: uid(), type: b.type, name: b.name, start: b.start, end: b.end, meets: b.type === 'period' && Array.isArray(g) && g.includes(b.num)}));\n    }\n  });\n  sc.all = {start: TIME_RE.test(def.start) ? def.start : '08:00', end: TIME_RE.test(def.end) ? def.end : '15:00'};\n  sc.hoursMode = DAYS.some(d => sc.days[d].start !== sc.all.start || sc.days[d].end !== sc.all.end) ? 'perDay' : 'all';\n  return sc;\n}\nfunction normalize(s) {\n  if (!s || typeof s !== 'object' || !Array.isArray(s.classes)) throw new Error('This does not look like a Class Scheduler backup.');\n  const legacy = !!(s.school && s.school.default && Array.isArray(s.school.default.blocks));\n  const out = newState();\n  out.h24 = !!s.h24; out.theme = s.theme === 'dark' || s.theme === 'light' ? s.theme : null;\n  (Array.isArray(s.templates) ? s.templates : []).forEach(t => {\n    if (t && typeof t === 'object' && t.data) out.templates.push({id: String(t.id || uid()), name: String(t.name || 'Template').slice(0, 60), data: sanitizeSched(t.data)});\n  });\n  s.classes.forEach(c => {\n    if (!c || typeof c !== 'object') return;\n    out.classes.push({\n      id: String(c.id || uid()), name: String(c.name || '').slice(0, 80), teacher: String(c.teacher || '').slice(0, 80),\n      room: String(c.room || '').slice(0, 40), notes: String(c.notes || '').slice(0, 1000),\n      color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[0],\n      weeks: clamp(parseInt(c.weeks, 10) || 1, 1, 5),\n      sched: legacy ? migrateSched(s.school, c) : sanitizeSched(c.sched)\n    });\n  });\n  return out;\n}\nfunction load() {\n  for (const k of [KEY, KEY_V1]) {\n    try { const raw = localStorage.getItem(k); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}\n  }\n  return newState();\n}\nlet S = load();\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }\n\nconst ui = {tab:'classes', sched:'master', week:1, day:'Mon', fClass:'', fTeacher:'', fRoom:'', q:'', cls:'', ed:null};\n\n/* ---------- time formatting ---------- */\nfunction fmt(t) {\n  if (S.h24) return t;\n  const [h, m] = t.split(':').map(Number);\n  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;\n}\nfunction fmtHour(m) {\n  const h = Math.floor(m / 60) % 24;\n  return S.h24 ? String(h).padStart(2, '0') + ':00' : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;\n}\nconst range = b => `${fmt(b.start)}–${fmt(b.end)}`;\n\n/* ---------- events, conflicts ---------- */\nconst cycleLen = (cls = S.classes) => cls.reduce((l, c) => l * c.weeks / gcd(l, c.weeks), 1);\nfunction classEvents(c, wi, day) {\n  if (!c.sched.days[day].on) return [];\n  return numbered(c.sched.tl[wi][day]).map(b => ({c, b, s: toMin(b.start), e: toMin(b.end), meet: b.type === 'period' && b.meets}));\n}\nconst meetEvents = (classes, mw, day) => classes.flatMap(c => classEvents(c, (mw - 1) % c.weeks, day).filter(x => x.meet && x.e > x.s));\nfunction overlapPairs(evs) {\n  const out = [];\n  for (let i = 0; i < evs.length; i++) for (let j = i + 1; j < evs.length; j++) {\n    const a = evs[i], b = evs[j];\n    if (a.c !== b.c && a.s < b.e && b.s < a.e) out.push([a, b]);\n  }\n  return out;\n}\nfunction findConflicts(classes) {\n  const L = cycleLen(classes), out = [];\n  for (let w = 1; w <= L; w++) for (const day of DAYS) {\n    for (const [a, b] of overlapPairs(meetEvents(classes, w, day)))\n      out.push({w, day, a: a.c, b: b.c, from: Math.max(a.s, b.s), to: Math.min(a.e, b.e)});\n  }\n  return out;\n}\nconst conflictText = c => `Week ${c.w} · ${DAYNAME[c.day]} · ${fmt(fromMin(c.from))}–${fmt(fromMin(c.to))}: ${esc(c.a.name || '(unnamed)')} &amp; ${esc(c.b.name || '(unnamed)')}`;\nfunction layoutEvents(evs) {\n  evs.sort((a, b) => a.s - b.s || b.e - a.e);\n  let cluster = [], end = -1;\n  const flush = () => {\n    const lanes = [];\n    cluster.forEach(ev => { let i = lanes.findIndex(le => le <= ev.s); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = ev.e; ev.lane = i; });\n    cluster.forEach(ev => { ev.lanes = lanes.length; });\n    cluster = [];\n  };\n  for (const ev of evs) {\n    if (cluster.length && ev.s >= end) flush();\n    cluster.push(ev); end = cluster.length === 1 ? ev.e : Math.max(end, ev.e);\n  }\n  if (cluster.length) flush();\n  return evs;\n}\n/* cols: [{label, events:[{s,e,kind,style,title,inner,bad}]}] */\nfunction calendar(cols, wide) {\n  const all = cols.flatMap(c => c.events);\n  if (!all.length) return '<p class=\"muted\">Nothing scheduled to show.<\/p>';\n  const lo = Math.floor(Math.min(...all.map(e => e.s)) / 60) * 60;\n  const hi = Math.min(1440, Math.ceil(Math.max(...all.map(e => e.e)) / 60) * 60);\n  const H = Math.max(60, (hi - lo) * SCALE);\n  let gut = '';\n  for (let m = lo; m <= hi; m += 60) gut += `<span style=\"top:${(m - lo) * SCALE}px\">${fmtHour(m)}<\/span>`;\n  let head = '<div class=\"calh\"><\/div>' + cols.map(c => `<div class=\"calh\">${esc(c.label)}<\/div>`).join('');\n  let body = `<div class=\"gut\">${gut}<\/div>` + cols.map(col => {\n    const evs = layoutEvents(col.events.map(e => ({...e})));\n    return `<div class=\"dcol\">${evs.map(e => {\n      const h = Math.max(16, (e.e - e.s) * SCALE);\n      return `<div class=\"ev ${e.kind || ''}${e.bad ? ' bad' : ''}\" style=\"top:${(e.s - lo) * SCALE}px;height:${h}px;left:calc(${e.lane / e.lanes * 100}% + 1px);width:calc(${100 / e.lanes}% - 2px);${e.style || ''}\" title=\"${esc(e.title)}\">${e.inner}<\/div>`;\n    }).join('')}<\/div>`;\n  }).join('');\n  return `<div class=\"calwrap\"><div class=\"cal\" style=\"--n:${cols.length};--H:${H}px;--hr:${60 * SCALE}px;${wide ? '--cw:260px' : ''}\">${head}${body}<\/div><\/div>`;\n}\nconst evKey = x => x.c.id + '|' + x.b.id;\nfunction masterCols(days, mw, vis) {\n  return days.map(day => {\n    const all = meetEvents(S.classes, mw, day), bad = new Set();\n    overlapPairs(all).forEach(([a, b]) => { bad.add(evKey(a)); bad.add(evKey(b)); });\n    return {label: day, events: all.filter(x => vis.has(x.c.id)).map(x => {\n      const c = x.c, wk = c.weeks > 1 ? ` · Wk ${(mw - 1) % c.weeks + 1}` : '';\n      return {s: x.s, e: x.e, kind: 'meet', bad: bad.has(evKey(x)), color: c.color, name: c.name || '(unnamed)', sub: [c.room, range(x.b)].filter(Boolean).join(' · ') + wk, style: `background:${c.color};color:${ink(c.color)}`,\n        title: `${c.name} · ${blockLabel(x.b)} · ${range(x.b)}${c.room ? ' · Room ' + c.room : ''}${bad.has(evKey(x)) ? ' · CONFLICT' : ''}`,\n        inner: `<b>${bad.has(evKey(x)) ? '⚠ ' : ''}${esc(c.name || '(unnamed)')}<\/b><small>${esc([c.room, range(x.b)].filter(Boolean).join(' · '))}${esc(wk)}<\/small>`};\n    })};\n  });\n}\nfunction classCols(c, wi) {\n  return activeDays(c).map(day => ({label: day, events: classEvents(c, wi, day).filter(x => x.e > x.s).map(x => {\n    const kind = x.meet ? 'meet' : x.b.type === 'period' ? 'free' : 't-' + x.b.type;\n    return {s: x.s, e: x.e, kind, style: x.meet ? `background:${c.color};color:${ink(c.color)}` : '',\n      title: `${blockLabel(x.b)} · ${range(x.b)}${x.meet ? ' · meets' : ''}`,\n      inner: `<b>${esc(blockLabel(x.b))}<\/b><small>${range(x.b)}${x.meet ? ' · meets' : ''}<\/small>`};\n  })}));\n}\n\n/* ---------- views: classes ---------- */\nconst meetCount = (c, wi) => DAYS.reduce((n, d) => n + (c.sched.days[d].on ? c.sched.tl[wi][d].filter(b => b.type === 'period' && b.meets).length : 0), 0);\nfunction hoursText(c) {\n  if (c.sched.hoursMode === 'all') return `${fmt(c.sched.all.start)}–${fmt(c.sched.all.end)}`;\n  return 'Hours vary by day';\n}\nfunction clsListHtml() {\n  const q = ui.q.trim().toLowerCase();\n  const list = S.classes.filter(c => !q || [c.name, c.teacher, c.room].some(x => x.toLowerCase().includes(q)));\n  if (!S.classes.length) return `<div class=\"card empty\"><h3>No classes yet<\/h3><p>Create a class, set its school hours and period times, and mark when it meets.<\/p><button class=\"btn primary\" data-a=\"newClass\">+ New class<\/button><\/div>`;\n  if (!list.length) return `<div class=\"card empty\"><h3>No matches<\/h3><p>Nothing matches “${esc(ui.q)}”.<\/p><\/div>`;\n  return '<div class=\"cls-grid\">' + list.map(c => {\n    const counts = Array.from({length: c.weeks}, (_, w) => meetCount(c, w));\n    return `<article class=\"card cls-card\" style=\"--c:${c.color}\">\n      <h3>${esc(c.name || '(unnamed)')}<\/h3>\n      <div class=\"muted small\">${[c.teacher, c.room && 'Room ' + c.room].filter(Boolean).map(esc).join(' · ') || 'No teacher / room'}<\/div>\n      <div class=\"muted small\" style=\"margin-top:2px\">${activeDays(c).join(' ')} · ${hoursText(c)}<\/div>\n      <div class=\"row\" style=\"margin-top:8px;gap:6px\"><span class=\"badge\">${c.weeks}-week schedule<\/span>\n        <span class=\"muted small\">${counts.map((n, i) => (c.weeks > 1 ? `W${i + 1}: ` : '') + n + ' meetings').join(' · ')}<\/span><\/div>\n      ${c.notes ? `<p class=\"small muted\" style=\"margin:8px 0 0;overflow-wrap:anywhere\">${esc(c.notes)}<\/p>` : ''}\n      <div class=\"acts\">\n        <button class=\"btn sm\" data-a=\"editClass\" data-id=\"${c.id}\">Edit<\/button>\n        <button class=\"btn sm\" data-a=\"viewClass\" data-id=\"${c.id}\">View schedule<\/button>\n        <button class=\"btn sm\" data-a=\"dupClass\" data-id=\"${c.id}\">Duplicate<\/button>\n        <button class=\"btn sm danger\" data-a=\"delClass\" data-id=\"${c.id}\">Delete<\/button>\n      <\/div><\/article>`;\n  }).join('') + '<\/div>';\n}\nfunction viewClasses() {\n  return `<div class=\"page-head\"><h2>Classes <span class=\"muted small\">(${S.classes.length})<\/span><\/h2>\n    <div class=\"row\"><input type=\"search\" placeholder=\"Search name, teacher, room\" value=\"${esc(ui.q)}\" data-u=\"q\" aria-label=\"Search classes\">\n    <button class=\"btn primary\" data-a=\"newClass\">+ New class<\/button><\/div><\/div><div id=\"clsList\">${clsListHtml()}<\/div>`;\n}\n\n/* ---------- views: schedule ---------- */\nconst opts = (items, sel) => items.map(([v, l]) => `<option value=\"${esc(v)}\"${v === sel ? ' selected' : ''}>${esc(l)}<\/option>`).join('');\nfunction conflictBar(conf) {\n  if (!S.classes.length) return '';\n  if (!conf.length) return '<div class=\"okbar\">✓ No conflicts: no two classes meet at overlapping times.<\/div>';\n  const items = conf.slice(0, 60).map(c => `<li>${conflictText(c)}<\/li>`).join('');\n  return `<details class=\"conf\"><summary>⚠ ${conf.length} conflict${conf.length > 1 ? 's' : ''}: classes meeting at overlapping times<\/summary><ul>${items}${conf.length > 60 ? `<li>…and ${conf.length - 60} more<\/li>` : ''}<\/ul><\/details>`;\n}\nfunction viewSchedule() {\n  const seg = `<div class=\"seg\" role=\"group\" aria-label=\"View\">${[['master','All classes'],['day','Single day'],['class','One class']].map(([k, l]) => `<button data-a=\"sched\" data-k=\"${k}\" aria-pressed=\"${ui.sched === k}\">${l}<\/button>`).join('')}<\/div>`;\n  const head = `<div class=\"page-head\"><h2>Schedule<\/h2><div class=\"row no-print\">${seg}<\/div><\/div>`;\n  if (!S.classes.length) return head + `<div class=\"card empty\"><h3>Nothing to show yet<\/h3><p>Add a class first.<\/p><button class=\"btn primary\" data-a=\"newClass\">+ New class<\/button><\/div>`;\n  const days = DAYS.filter(d => S.classes.some(c => c.sched.days[d].on));\n  if (!days.length) return head + `<div class=\"card empty\"><h3>No school days enabled<\/h3><p>Turn on at least one day in a class.<\/p><\/div>`;\n  const L = cycleLen(); if (ui.week > L || ui.week < 1) ui.week = 1;\n  const weekCtl = `<label class=\"f\">Week<span class=\"row\" style=\"gap:4px\"><button class=\"btn icon\" data-a=\"wk\" data-d=\"-1\" aria-label=\"Previous week\">‹<\/button>\n    <select data-u=\"week\" data-num aria-label=\"Week\">${Array.from({length: L}, (_, i) => `<option value=\"${i + 1}\"${ui.week === i + 1 ? ' selected' : ''}>Week ${i + 1}<\/option>`).join('')}<\/select>\n    <button class=\"btn icon\" data-a=\"wk\" data-d=\"1\" aria-label=\"Next week\">›<\/button><\/span><\/label>`;\n  const conf = findConflicts(S.classes);\n  const note = L > 1 ? `<p class=\"muted small\">Weeks aren’t tied to calendar dates. All classes start their cycle together, so a ${L}-week combined cycle is needed to show every combination. A shorter-cycle class repeats (a 2-week class shows its Week 1 in combined weeks 1, 3, 5…).<\/p>` : '';\n  let body = '';\n  if (ui.sched === 'master') {\n    const teachers = [...new Set(S.classes.map(c => c.teacher).filter(Boolean))].sort();\n    const rooms = [...new Set(S.classes.map(c => c.room).filter(Boolean))].sort();\n    const vis = new Set(S.classes.filter(c => (!ui.fClass || c.id === ui.fClass) && (!ui.fTeacher || c.teacher === ui.fTeacher) && (!ui.fRoom || c.room === ui.fRoom)).map(c => c.id));\n    body = conflictBar(conf) + `<div class=\"controls no-print\">${weekCtl}\n      <label class=\"f\">Class<select data-u=\"fClass\"><option value=\"\">All classes<\/option>${opts(S.classes.map(c => [c.id, c.name || '(unnamed)']), ui.fClass)}<\/select><\/label>\n      <label class=\"f\">Teacher<select data-u=\"fTeacher\"><option value=\"\">All teachers<\/option>${opts(teachers.map(t => [t, t]), ui.fTeacher)}<\/select><\/label>\n      <label class=\"f\">Room<select data-u=\"fRoom\"><option value=\"\">All rooms<\/option>${opts(rooms.map(t => [t, t]), ui.fRoom)}<\/select><\/label>\n      ${ui.fClass || ui.fTeacher || ui.fRoom ? '<button class=\"btn sm\" data-a=\"clearFilters\">Clear filters<\/button>' : ''}<\/div>\n      <h3 class=\"weekhead\">Week ${ui.week}${L > 1 ? ` of ${L}` : ''}<\/h3>${calendar(masterCols(days, ui.week, vis))}${note}`;\n  } else if (ui.sched === 'day') {\n    if (!days.includes(ui.day)) ui.day = days[0];\n    const vis = new Set(S.classes.map(c => c.id));\n    const col = masterCols([ui.day], ui.week, vis)[0];\n    const list = [...col.events].sort((a, b) => a.s - b.s).map(e => `<li><span class=\"dot\" style=\"background:${e.color}\"><\/span><b>${esc(e.name)}<\/b><span class=\"muted\">${esc(e.sub)}<\/span>${e.bad ? ' <span class=\"field-err\">⚠ conflict<\/span>' : ''}<\/li>`).join('');\n    body = conflictBar(conf) + `<div class=\"controls no-print\">${weekCtl}\n      <label class=\"f\">Day<select data-u=\"day\">${opts(days.map(d => [d, DAYNAME[d]]), ui.day)}<\/select><\/label><\/div>\n      <h3 class=\"weekhead\">${DAYNAME[ui.day]} · Week ${ui.week}${L > 1 ? ` of ${L}` : ''}<\/h3>${calendar([col], true)}${list ? `<ul class=\"dlist\">${list}<\/ul>` : ''}${note}`;\n  } else {\n    if (!S.classes.some(c => c.id === ui.cls)) ui.cls = S.classes[0].id;\n    const c = S.classes.find(x => x.id === ui.cls);\n    let weeks = '';\n    for (let w = 0; w < c.weeks; w++)\n      weeks += `<h3 class=\"weekhead\">${c.weeks > 1 ? `Week ${w + 1} of ${c.weeks}` : 'Weekly schedule'}<\/h3>${calendar(classCols(c, w))}`;\n    body = `<div class=\"controls no-print\"><label class=\"f\">Class<select data-u=\"cls\">${opts(S.classes.map(x => [x.id, x.name || '(unnamed)']), ui.cls)}<\/select><\/label>\n      <button class=\"btn sm\" data-a=\"editClass\" data-id=\"${c.id}\">Edit this class<\/button><\/div>\n      <div class=\"row\"><span class=\"badge\" style=\"background:${c.color};color:${ink(c.color)};border-color:${c.color}\">${esc(c.name || '(unnamed)')}<\/span>\n      <span class=\"muted small\">${[c.teacher, c.room && 'Room ' + c.room].filter(Boolean).map(esc).join(' · ')} · ${c.weeks}-week schedule · ${hoursText(c)}<\/span><\/div>${weeks}`;\n  }\n  return head + body;\n}\n\n/* ---------- class editor ---------- */\nfunction newClass() {\n  const used = new Set(S.classes.map(c => c.color));\n  return {id: uid(), name: '', teacher: '', room: '', notes: '', weeks: 1, sched: blankSched(),\n    color: PALETTE.find(c => !used.has(c)) || PALETTE[S.classes.length % PALETTE.length]};\n}\nconst firstOn = d => DAYS.find(x => d.sched.days[x].on) || 'Mon';\nfunction openEditor(c, isNew) {\n  const draft = clone(c);\n  ui.ed = {draft, orig: JSON.stringify(c), isNew, step: 1, week: 1, day: firstOn(draft), tplId: null, panel: false, code: '', tplMsg: ''};\n  renderEditor();\n  const n = document.getElementById('edName'); if (n) n.focus();\n}\nfunction closeEditor(force) {\n  if (!ui.ed) return;\n  if (!force && JSON.stringify(ui.ed.draft) !== ui.ed.orig && !confirm('Discard your changes to this class?')) return;\n  ui.ed = null; renderEditor();\n}\nfunction validateBlocks(blocks, hrs) {\n  const errs = [], bad = new Set(), bl = [...blocks].sort(cmpBlock);\n  const s = toMin(hrs.start), e = toMin(hrs.end);\n  if (e <= s) errs.push('School hours end must be after they start.');\n  bl.forEach((b, i) => {\n    const bs = toMin(b.start), be = toMin(b.end), nm = b.type === 'period' ? 'A class period' : (b.name || TYPES[b.type].label);\n    if (be <= bs) { errs.push(`${nm} (${fmt(b.start)}): end must be after start.`); bad.add(b.id); }\n    if (bs < s || be > e) { errs.push(`${nm} (${range(b)}) is outside school hours (${fmt(hrs.start)}–${fmt(hrs.end)}).`); bad.add(b.id); }\n    if (i + 1 < bl.length && toMin(bl[i + 1].start) < be) { errs.push(`${nm} (${range(b)}) overlaps the next block.`); bad.add(b.id); bad.add(bl[i + 1].id); }\n  });\n  return {errs, bad};\n}\nfunction classProblems(c) {\n  const out = [];\n  for (let w = 0; w < c.weeks; w++) for (const d of activeDays(c)) {\n    const {errs} = validateBlocks(c.sched.tl[w][d], c.sched.days[d]);\n    if (errs.length) out.push({w, d, text: `${c.weeks > 1 ? `Week ${w + 1} · ` : ''}${DAYNAME[d]}: ${errs[0]}`});\n  }\n  return out;\n}\n\n/* template mode: every edit is copied to all days/weeks and recorded into the active template */\nfunction touch(kind, day) {\n  const e = ui.ed; if (!e || !e.tplId) return;\n  const s = e.draft.sched;\n  if (kind === 'blocks') {\n    const src = s.tl[e.week - 1][e.day];\n    for (let w = 0; w < 5; w++) for (const d of DAYS) if (!(w === e.week - 1 && d === e.day)) s.tl[w][d] = cloneBlocks(src);\n  } else if (kind === 'hours' && s.hoursMode === 'perDay' && day) {\n    DAYS.forEach(d => { s.days[d].start = s.days[day].start; s.days[d].end = s.days[day].end; });\n  }\n  const t = S.templates.find(x => x.id === e.tplId);\n  if (t) { t.data = clone(s); save(); }\n}\nfunction encodeTpl(t) {\n  const uniq = [], idx = new Map(), g = [];\n  for (let w = 0; w < 5; w++) { g.push([]); for (const d of DAYS) {\n    const compact = t.data.tl[w][d].map(b => [b.type, b.name, b.start, b.end, b.meets ? 1 : 0]), k = JSON.stringify(compact);\n    if (!idx.has(k)) { idx.set(k, uniq.length); uniq.push(compact); }\n    g[w].push(idx.get(k));\n  } }\n  const o = {n: t.name, m: t.data.hoursMode, a: t.data.all, d: DAYS.map(d => [t.data.days[d].on ? 1 : 0, t.data.days[d].start, t.data.days[d].end]), u: uniq, g};\n  return 'CS1:' + btoa(unescape(encodeURIComponent(JSON.stringify(o))));\n}\nfunction decodeTpl(str) {\n  const m = /^CS1:([A-Za-z0-9+/=]+)$/.exec(String(str).trim());\n  if (!m) throw new Error('That is not a valid template code.');\n  let o; try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { throw new Error('That template code is damaged.'); }\n  const raw = {hoursMode: o.m, all: o.a, days: {}, tl: []};\n  DAYS.forEach((d, i) => { const x = o.d && o.d[i]; if (x) raw.days[d] = {on: !!x[0], start: x[1], end: x[2]}; });\n  for (let w = 0; w < 5; w++) { raw.tl.push({}); DAYS.forEach((d, i) => {\n    const list = (o.u && o.u[o.g && o.g[w] && o.g[w][i]]) || [];\n    raw.tl[w][d] = list.map(a => ({type: a[0], name: a[1], start: a[2], end: a[3], meets: !!a[4]}));\n  }); }\n  return {name: String(o.n || 'Imported template').slice(0, 60), data: sanitizeSched(raw)};\n}\n\n/* ---- editor step renderers ---- */\nfunction stepBasics() {\n  const d = ui.ed.draft;\n  return `<div class=\"form-grid\">\n      <label class=\"f\">Class name *<input type=\"text\" id=\"edName\" data-d=\"name\" value=\"${esc(d.name)}\" maxlength=\"80\" placeholder=\"e.g. Algebra II\" autocomplete=\"off\"><span id=\"nameMsg\" class=\"field-err\" aria-live=\"polite\"><\/span><\/label>\n      <label class=\"f\">Teacher<input type=\"text\" data-d=\"teacher\" value=\"${esc(d.teacher)}\" maxlength=\"80\" autocomplete=\"off\"><\/label>\n      <label class=\"f\">Room<input type=\"text\" data-d=\"room\" value=\"${esc(d.room)}\" maxlength=\"40\" autocomplete=\"off\"><\/label><\/div>\n    <div class=\"row\"><b>Color<\/b><div class=\"swatches\" id=\"swatches\">${PALETTE.map(c => `<button type=\"button\" class=\"sw\" style=\"background:${c}\" data-a=\"color\" data-c=\"${c}\" aria-pressed=\"${d.color.toLowerCase() === c}\" aria-label=\"Color ${c}\"><\/button>`).join('')}\n        <input type=\"color\" id=\"edColor\" value=\"${d.color}\" aria-label=\"Custom color\"><\/div><\/div>\n    <label class=\"f\">Notes<textarea data-d=\"notes\" rows=\"2\" maxlength=\"1000\">${esc(d.notes)}<\/textarea><\/label>\n    <div class=\"row\"><b>Schedule length<\/b><div class=\"seg\" role=\"group\" aria-label=\"Schedule length\">${[1,2,3,4,5].map(n => `<button type=\"button\" data-a=\"cycle\" data-n=\"${n}\" aria-pressed=\"${d.weeks === n}\">${n}<\/button>`).join('')}<\/div>\n      <span class=\"muted small\">${d.weeks === 1 ? 'Same every week' : `Rotates over ${d.weeks} weeks`}<\/span><\/div>\n    <div><b>School days<\/b><div class=\"row\" style=\"margin-top:6px\">${DAYS.map(x => `<label class=\"daychk\"><input type=\"checkbox\" data-e=\"dayOn\" data-day=\"${x}\" ${d.sched.days[x].on ? 'checked' : ''}> ${DAYNAME[x]}<\/label>`).join('')}<\/div><\/div>`;\n}\nfunction tplBar() {\n  const e = ui.ed, t = S.templates.find(x => x.id === e.tplId);\n  let h = `<div class=\"tplbar${t ? ' on' : ''}\">`;\n  if (t) {\n    h += `<div class=\"row\" style=\"justify-content:space-between\"><div><b>Template mode: ON<\/b> · recording to “${esc(t.name)}”<div class=\"muted small\">Every edit is copied to all days and all weeks of this class, and saved into the template.<\/div><\/div>\n      <div class=\"row\"><button type=\"button\" class=\"btn sm\" data-a=\"tplCopy\" data-id=\"${t.id}\">Copy code<\/button><button type=\"button\" class=\"btn sm primary\" data-a=\"tplOff\">Turn off<\/button><\/div><\/div>`;\n  } else {\n    h += `<div class=\"row\" style=\"justify-content:space-between\"><div><b>Template mode: off<\/b><div class=\"muted small\">Edit each day and week on its own, or use a template to fill everything at once.<\/div><\/div>\n      <button type=\"button\" class=\"btn sm\" data-a=\"tplOpen\" aria-expanded=\"${e.panel}\">$ mentById('overlay'), m = document.getElementById('modal');\n  if (!ui.ed) { ov.hidden = true; m.innerHTML = ''; return; }\n  const e = ui.ed;\n  ov.hidden = false;\n  m.innerHTML = `<div class=\"modal-head\"><h2 id=\"edTitle\" style=\"font-size:18px\">${e.isNew ? 'New class' : 'Edit class'}<\/h2><button class=\"btn sm\" data-a=\"edCancel\">✕ Close<\/button><\/div>\n    <form class=\"modal-body\" id=\"edForm\" novalidate>\n      <div class=\"steps\" role=\"tablist\" aria-label=\"Steps\">${['Basics', 'School hours', 'Periods'].map((l, i) => `<button type=\"button\" class=\"step\" role=\"tab\" data-a=\"step\" data-n=\"${i + 1}\" aria-selected=\"${e.step === i + 1}\">${i + 1}. ${l}<\/button>`).join('')}<\/div>\n      <div id=\"edStep\" style=\"display:flex;flex-direction:column;gap:14px\">${stepBody()}<\/div>\n    <\/form>\n    <div class=\"modal-foot\"><span class=\"field-err\" id=\"saveMsg\" aria-live=\"polite\"><\/span><div class=\"row\">\n      <button class=\"btn\" data-a=\"stepBack\" ${e.step === 1 ? 'disabled' : ''}>Back<\/button><button class=\"btn\" data-a=\"stepNext\" ${e.step === 3 ? 'disabled' : ''}>Next<\/button>\n      <button class=\"btn\" data-a=\"edCancel\">Cancel<\/button><button class=\"btn primary\" data-a=\"edSave\">Save class<\/button><\/div><\/div>`;\n  updateNameMsg();\n}\nfunction setStep(n) { ui.ed.step = clamp(n, 1, 3); renderEditor(); const el = document.getElementById('edName'); if (el && ui.ed.step === 1) el.focus(); }\nfunction updateNameMsg() {\n  const el = document.getElementById('nameMsg'); if (!el || !ui.ed) return;\n  const d = ui.ed.draft, n = d.name.trim().toLowerCase();\n  const dup = n && S.classes.some(c => c.id !== d.id && c.name.trim().toLowerCase() === n);\n  el.className = dup ? 'field-warn' : 'field-err';\n  el.textContent = dup ? 'Another class already has this name.' : '';\n}\nfunction saveEditor() {\n  const e = ui.ed, d = e.draft, msg = document.getElementById('saveMsg');\n  d.name = d.name.trim();\n  if (!d.name) { set = 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;\n      S.theme = dark ? 'light' : 'dark'; save(); render(); break;\n    }\n  }\n});\ndocument.addEventListener('change', ev => {\n  const t = ev.target, e = ui.ed;\n  if (t.id === 'edColor' && e) {\n    e.draft.color = t.value;\n    document.querySelectorAll('#swatches .sw').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.c === t.value))); return;\n  }\n  if (t.dataset.u) { ui[t.dataset.u] = t.dataset.num !== undefined ? Number(t.value) : t.value; render(); return; }\n  const em = t.dataset.e; if (!em || !e) return;\n  const s = e.draft.sched;\n  switch (em) {\n    case 'dayOn': s.days[t.dataset.day].on = t.checked; if (!t.checked && e.day === t.dataset.day) e.day = firstOn(e.draft); refreshStep(); return;\n    case 'hMode':\n      if (t.value === 'all') {\n        const d0 = s.days[firstOn(e.draft)]; s.all = {start: d0.start, end: d0.end}; DAYS.forEach(d => { s.days[d].start = s.all.start; s.days[d].end = s.all.end; });\n      }\n      s.hoursMode = t.value; touch('hours'); refreshStep(); return;\n    case 'hAllStart': case 'hAllEnd': {\n      const k = em === 'hAllStart' ? 'start' : 'end';\n      if (TIME_RE.test(t.value)) { s.all[k] = t.value; DAYS.forEach(d => { s.days[d][k] = t.value; }); touch('hours'); }\n      refreshStep(); return;\n    }\n    case 'hStart': case 'hEnd': {\n      const k = em === 'hStart' ? 'start' : 'end', day = t.dataset.day;\n      if (TIME_RE.test(t.value)) { s.days[day][k] = t.value; touch('hours', day); }\n      refreshStep(); return;\n    }\n  }\n  const list = s.tl[e.week - 1][e.day], b = list.find(x => x.id === t.dataset.id); if (!b) return;\n  if (em === 'type') { b.type = t.value; if (b.type === 'period') { b.name = ''; } else { b.meets = false; if (!b.name) b.name = TYPES[b.type].label; } }\n  else if (em === 'start' && TIME_RE.test(t.value)) { const len = blockLen(b); b.start = t.value; if (len > 0) b.end = fromMin(Math.min(1439, toMin(b.start) + len)); }\n  else if (em === 'end' && TIME_RE.test(t.value)) b.end = t.value;\n  else if (em === 'len') { const n = parseInt(t.value, 10); if (n > 0) b.end = fromMin(Math.min(1439, toMin(b.start) + n)); }\n  else if (em === 'meets') b.meets = t.checked;\n  list.sort(cmpBlock); touch('blocks'); refreshStep();\n});\ndocument.addEventListener('input', ev => {\n  const t = ev.target;\n  if (t.dataset.u === 'q') { ui.q = t.value; document.getElementById('clsList').innerHTML = clsListHtml(); return; }\n  if (t.dataset.d && ui.ed) { ui.ed.draft[t.dataset.d] = t.value; if (t.dataset.d === 'name') updateNameMsg(); return; }\n  if (t.dataset.e === 'name' && ui.ed) {\n    const b = ui.ed.draft.sched.tl[ui.ed.week - 1][ui.ed.day].find(x => x.id === t.dataset.id);\n    if (b) { b.name = t.value; touch('blocks'); }\n  }\n});\ndocument.getElementById('file').addEventListener('change', ev => {\n  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;\n  const rd = new FileReader();\n  rd.onload = () => {\n    try {\n      const next = normalize(JSON.parse(rd.result));\n      if (!confirm(`Replace everything with this file (${next.classes.length} classes, ${next.templates.length} templates)? Your current data will be overwritten.`)) return;\n      S = next; ui.ed = null; save(); render(); toast('Imported.');\n    } catch (err) { alert('Import failed: ' + err.message); }\n  };\n  rd.readAsText(f);\n});\ndocument.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.ed) closeEditor(); });\ndocument.getElementById('overlay').addEventListener('mousedown', ev => { if (ev.target.id === 'overlay') closeEditor(); });\ndocument.addEventListener('submit', ev => { ev.preventDefault(); });\n\nrender();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
